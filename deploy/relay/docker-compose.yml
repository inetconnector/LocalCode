services:
  localcode-relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      # Optional: override max concurrent sessions or frame limits via CLI flags if needed
      - TZ=UTC

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - localcode-relay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
