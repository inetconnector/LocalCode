name: One-time persistent approval rule hardening

on:
  push:
    branches: [agent/security-quality-hardening]
    paths:
      - .github/workflows/one-time-approval-rules.yml

permissions:
  contents: write

concurrency:
  group: one-time-persistent-approval-rule-hardening
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/go.mod
      - name: Make persistent Git approvals exact and config update atomic
        shell: pwsh
        run: |
          $path = 'src/approval_rules.go'
          $content = Get-Content -LiteralPath $path -Raw

          $gitPattern = '(?ms)\tcase "git":\s*\n\t\tif err := validateGitArgs\(action\.Args\); err != nil \{\s*\n\t\t\treturn nil, false\s*\n\t\t\}\s*\n\t\tif len\(tokens\) >= 2 \{.*?\n\t\t\}'
          $gitReplacement = @'
          	case "git":
          		if err := validateGitArgs(action.Args); err != nil {
          			return nil, false
          		}
          		// Persist the complete structured argument vector. Approving one
          		// branch/tag/remote action must not authorize every future action
          		// sharing the same Git subcommand.
          		return tokens, true
          '@
          $updated = [regex]::Replace($content, $gitPattern, $gitReplacement, 1)
          if ($updated -eq $content) { throw 'persistent Git approval block not found' }
          $content = $updated

          $addPattern = '(?ms)^func \(s \*AppState\) addApprovalRule\(project string, action AgentAction, scope string\) \(ApprovalRule, error\) \{.*?^\}'
          $addReplacement = @'
          func (s *AppState) addApprovalRule(project string, action AgentAction, scope string) (ApprovalRule, error) {
          	pattern, ok := persistentApprovalPattern(action)
          	if !ok {
          		return ApprovalRule{}, errors.New("this action cannot be persistently allowed")
          	}
          	rule, err := normalizeApprovalRule(ApprovalRule{
          		Scope:         scope,
          		Project:       project,
          		Decision:      "allow",
          		Pattern:       pattern,
          		Justification: "Approved by the user from the LocalCode approval prompt.",
          	})
          	if err != nil {
          		return ApprovalRule{}, err
          	}

          	// Serialize the in-memory mutation and its durable snapshot under the
          	// state lock. This prevents a stale approval-rule snapshot from being
          	// written back over a concurrent settings change.
          	s.mu.Lock()
          	cfg := s.Config
          	cfg.ApprovalRules = normalizeApprovalRules(append(cfg.ApprovalRules, rule))
          	if err := saveConfig(cfg); err != nil {
          		s.mu.Unlock()
          		return ApprovalRule{}, err
          	}
          	s.Config = cfg
          	s.mu.Unlock()
          	return rule, nil
          }
          '@
          $updated = [regex]::Replace($content, $addPattern, $addReplacement, 1)
          if ($updated -eq $content) { throw 'addApprovalRule boundary not found' }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $updated, [System.Text.UTF8Encoding]::new($false))
          gofmt -w $path
      - name: Add persistent approval regression tests
        shell: pwsh
        run: |
          @'
          // SPDX-License-Identifier: Apache-2.0

          package main

          import (
          	"reflect"
          	"testing"
          )

          func TestPersistentGitApprovalPatternKeepsCompleteArguments(t *testing.T) {
          	action := AgentAction{Action: "git", Args: []string{"branch", "new-feature"}}
          	pattern, ok := persistentApprovalPattern(action)
          	if !ok {
          		t.Fatal("safe structured Git action should support persistent approval")
          	}
          	want := []string{"git", "branch", "new-feature"}
          	if !reflect.DeepEqual(pattern, want) {
          		t.Fatalf("pattern = %#v, want exact %#v", pattern, want)
          	}
          	if rulePatternMatches(pattern, []string{"git", "branch", "different-feature"}) {
          		t.Fatal("approval for one branch name must not match another branch mutation")
          	}
          }

          func TestPersistentShellApprovalRemainsExactCommandToken(t *testing.T) {
          	action := AgentAction{Action: "run_command", Command: "go test ./... && echo done"}
          	pattern, ok := persistentApprovalPattern(action)
          	if !ok || len(pattern) != 2 {
          		t.Fatalf("unexpected exact shell pattern: %#v ok=%v", pattern, ok)
          	}
          	if rulePatternMatches(pattern, []string{"shell", "go test ./... && echo changed"}) {
          		t.Fatal("persistent shell approval must not act as a command prefix wildcard")
          	}
          }
          '@ | Set-Content -LiteralPath 'src/approval_rule_security_test.go' -Encoding utf8NoBOM
          gofmt -w src/approval_rule_security_test.go
      - name: Verify approval-rule tests
        shell: pwsh
        working-directory: src
        run: go test ./... -run 'TestPersistentGitApprovalPattern|TestPersistentShellApproval|TestToolReadOnlyClassifier|TestGitReadOnlyClassifier' -count=1 -timeout=10m
      - name: Commit migration and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/one-time-approval-rules.yml'
          git config user.name 'LocalCode Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: make persistent approvals exact and serialized'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin agent/security-quality-hardening
            git rebase origin/agent/security-quality-hardening
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'Rebase failed; refusing to force-push the hardening branch.'
            }
            git push origin HEAD:agent/security-quality-hardening
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 2 }
          }
          throw 'Could not fast-forward push persistent approval hardening.'
