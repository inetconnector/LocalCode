name: Project trash UX patch

on:
  push:
    branches: [feat/project-trash-ux]
    paths: [.github/workflows/project-trash-ux-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-trash-ux
          fetch-depth: 0
      - name: Apply exact issue 31 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # Desktop routes reuse the existing reversible quarantine backend.
          replace_once(
              'src/server.go',
              '\ts.mux.HandleFunc("/api/project-action", s.handleProjectAction)\n',
              '\ts.mux.HandleFunc("/api/project-action", s.handleProjectAction)\n'
              '\ts.mux.HandleFunc("/api/project-delete-preview", s.handleProjectDeletePreview)\n'
              '\ts.mux.HandleFunc("/api/project-quarantine", s.handleProjectQuarantineList)\n'
              '\ts.mux.HandleFunc("/api/project-quarantine-action", s.handleProjectQuarantineAction)\n'
          )

          # Exact project-name confirmation means exact, including case.
          replace_once(
              'src/project_catalog.go',
              '\t\tif value == "" || !strings.EqualFold(value, preview.Confirmation) {\n\t\t\treturn ProjectSummary{}, errors.New("recursive delete confirmation must match the folder name")\n\t\t}\n',
              '\t\tif value == "" || value != preview.Confirmation {\n\t\t\treturn ProjectSummary{}, errors.New("quarantine confirmation must exactly match the folder name")\n\t\t}\n'
          )

          # Mobile remains allowlisted, but issue #31 requires the narrow create_folder action too.
          replace_once(
              'src/remote_project_api.go',
              '\tcase "create_project", "delete_empty", "delete_recursive":\n',
              '\tcase "create_folder", "create_project", "delete_empty", "delete_recursive":\n'
          )

          write('src/project_quarantine_state.go', r'''// SPDX-License-Identifier: Apache-2.0

package main

import (
    "errors"
    "path/filepath"
    "strings"
)

func (s *AppState) ListProjectQuarantine() ([]QuarantinedProject, error) {
    s.mu.RLock()
    root := s.Config.RootProjectDir
    s.mu.RUnlock()
    return listQuarantinedProjects(root)
}

func (s *AppState) ProjectQuarantineAction(action, id, confirmation string) (QuarantinedProject, error) {
    action = strings.ToLower(strings.TrimSpace(action))
    id = strings.TrimSpace(id)
    if !validQuarantineID(id) {
        return QuarantinedProject{}, errors.New("invalid quarantine id")
    }

    s.mu.RLock()
    root := s.Config.RootProjectDir
    running := s.Running
    s.mu.RUnlock()
    if running {
        return QuarantinedProject{}, errors.New("agent is running")
    }

    switch action {
    case "restore":
        entry, err := restoreQuarantinedProject(root, id)
        if err != nil {
            return QuarantinedProject{}, err
        }
        s.restoreProjectThreadReferences(entry.OriginalPath)
        return entry, nil
    case "purge":
        return purgeQuarantinedProject(root, id, confirmation)
    default:
        return QuarantinedProject{}, errors.New("quarantine action is not allowed")
    }
}

func (s *AppState) restoreProjectThreadReferences(project string) {
    project = filepath.Clean(project)
    changed := false
    var snapshot map[string]*ChatThread

    s.mu.Lock()
    for _, thread := range s.Threads {
        if thread == nil || !strings.EqualFold(filepath.Clean(thread.Project), project) {
            continue
        }
        if thread.Archived {
            thread.Archived = false
            changed = true
        }
    }
    if changed {
        snapshot = cloneThreadSnapshotLocked(s.Threads)
    }
    s.mu.Unlock()

    if changed {
        s.queueThreadSave(snapshot)
    }
}
''')

          write('src/project_trash_desktop_api.go', r'''// SPDX-License-Identifier: Apache-2.0

package main

import (
    "net/http"
    "strings"
)

const desktopProjectTrashMaxBody = 16 << 10

func (s *Server) handleProjectDeletePreview(w http.ResponseWriter, r *http.Request) {
    if r.Method != http.MethodGet {
        http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
        return
    }
    path := strings.TrimSpace(r.URL.Query().Get("path"))
    if path == "" {
        http.Error(w, "project path is required", http.StatusBadRequest)
        return
    }
    s.state.mu.RLock()
    root := s.state.Config.RootProjectDir
    running := s.state.Running
    s.state.mu.RUnlock()
    if running {
        http.Error(w, "agent is running", http.StatusConflict)
        return
    }
    preview, err := inspectProjectDelete(root, path)
    if err != nil {
        http.Error(w, err.Error(), http.StatusBadRequest)
        return
    }
    w.Header().Set("Content-Type", "application/json")
    _ = writeJSON(w, preview)
}

func (s *Server) handleProjectQuarantineList(w http.ResponseWriter, r *http.Request) {
    if r.Method != http.MethodGet {
        http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
        return
    }
    entries, err := s.state.ListProjectQuarantine()
    if err != nil {
        http.Error(w, err.Error(), http.StatusInternalServerError)
        return
    }
    w.Header().Set("Content-Type", "application/json")
    _ = writeJSON(w, map[string]any{"quarantine": entries})
}

func (s *Server) handleProjectQuarantineAction(w http.ResponseWriter, r *http.Request) {
    if r.Method != http.MethodPost {
        http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
        return
    }
    r.Body = http.MaxBytesReader(w, r.Body, desktopProjectTrashMaxBody)
    var req struct {
        Action       string `json:"action"`
        ID           string `json:"id"`
        Confirmation string `json:"confirmation"`
    }
    if err := readJSON(r.Body, &req); err != nil {
        http.Error(w, "invalid quarantine request", http.StatusBadRequest)
        return
    }
    req.Action = strings.ToLower(strings.TrimSpace(req.Action))
    req.ID = strings.TrimSpace(req.ID)
    if !validQuarantineID(req.ID) {
        http.Error(w, "invalid quarantine id", http.StatusBadRequest)
        return
    }
    if req.Action != "restore" && req.Action != "purge" {
        http.Error(w, "quarantine action is not allowed", http.StatusForbidden)
        return
    }
    entry, err := s.state.ProjectQuarantineAction(req.Action, req.ID, req.Confirmation)
    if err != nil {
        http.Error(w, err.Error(), http.StatusConflict)
        return
    }
    message := "project restored from quarantine"
    if req.Action == "purge" {
        message = "project permanently purged from quarantine"
    }
    s.state.AddEvent(UIEvent{Type: "action_done", Message: message, Detail: entry.Name, Action: "project_quarantine_" + req.Action})
    w.Header().Set("Content-Type", "application/json")
    _ = writeJSON(w, map[string]any{"ok": true, "action": req.Action, "project": entry})
}
''')

