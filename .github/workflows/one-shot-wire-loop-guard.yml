name: One-shot wire session loop guard

on:
  push:
    branches:
      - agent/session-doom-loop-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/session-doom-loop-guard
          fetch-depth: 1

      - name: Wire loop guard into agent loop and self-remove
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/agent.go")
          text = path.read_text(encoding="utf-8")

          replacements = []

          needle = "\tblockedFinishCounts := map[string]int{}\n\tfor step := 1; step <= maxSteps; step++ {"
          replacement = "\tblockedFinishCounts := map[string]int{}\n\tloopGuard := newAgentLoopGuard()\n\tfor step := 1; step <= maxSteps; step++ {"
          replacements.append((needle, replacement, "loop guard initialization"))

          needle = "\t\tsignature := actionSignature(action)\n\t\tif signature == lastSignature && action.Action != \"finish\" {"
          replacement = '''\t\tif reason := loopGuard.ShouldBlock(action); reason != "" {
          \t\trepeatBlocks++
          \t\ts.AddEvent(UIEvent{Type: "warning", Message: localizeConfigText(cfg, "Stagnierende Werkzeugschleife blockiert", "Stagnating tool loop blocked"), Detail: reason, Action: action.Action})
          \t\thint := "SYSTEMHINWEIS: LocalCode hat eine sessionweite Werkzeugschleife erkannt. Wiederhole weder dieselbe Werkzeugaktion noch denselben Aktionszyklus unverändert. Nutze neue Information: lies eine andere relevante Datei, verwende Repository-Intelligence oder subagent_analyze, ändere die Diagnose oder repariere die konkrete Ursache."
          \t\tif repeatBlocks >= 2 {
          \t\t\thint += " Nach wiederholter Schleifenerkennung: führe einen unabhängigen Read-only-Preflight mit subagent_analyze aus oder beende mit einer präzisen, belegten Fehlerursache statt weiter zu kreisen."
          \t\t}
          \t\tmessages = append(messages, OllamaMessage{Role: "user", Content: hint})
          \t\tcontinue
          \t}
          \t\tsignature := actionSignature(action)
          \t\tif signature == lastSignature && action.Action != "finish" {'''
          replacements.append((needle, replacement, "pre-execution loop guard"))

          needle = "\t\tif actionVerifiesProject(action, originalTask) && !toolFailed {\n\t\t\tchangedSinceVerification = false\n\t\t}\n\t\ttoolMessage := \"TOOL RESULT for \" + action.Action + \":\\n\" + truncateText(result, contextToolResultLimit(cfg))"
          replacement = "\t\tif actionVerifiesProject(action, originalTask) && !toolFailed {\n\t\t\tchangedSinceVerification = false\n\t\t}\n\t\tloopGuard.Observe(action, result, toolFailed, originalTask)\n\t\ttoolMessage := \"TOOL RESULT for \" + action.Action + \":\\n\" + truncateText(result, contextToolResultLimit(cfg))"
          replacements.append((needle, replacement, "post-execution observation"))

          for needle, replacement, label in replacements:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} anchor, found {count}")
              text = text.replace(needle, replacement, 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/one-shot-wire-loop-guard.yml").unlink()
          '@ | python -

          gofmt -w src/agent.go src/agent_loop_guard.go src/agent_loop_guard_test.go src/noop_edit_test.go src/tools.go
          git diff --check
          git diff -- src/agent.go src/agent_loop_guard.go src/tools.go

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent.go src/agent_loop_guard.go src/agent_loop_guard_test.go src/noop_edit_test.go src/tools.go .github/workflows/one-shot-wire-loop-guard.yml
          git commit -m "reliability: wire session-wide loop guard [loop-guard-integrated]"
          git push origin HEAD:agent/session-doom-loop-guard
