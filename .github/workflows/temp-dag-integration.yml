name: Temporary DAG integration patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/native-agent-task-dag' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/native-agent-task-dag
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Integrate planner DAG handoff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Replace-Exact([string]$path, [string]$old, [string]$new) {
            $text = [IO.File]::ReadAllText($path)
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne 1) { throw "Expected exactly one anchor in ${path}, found ${count}: ${old}" }
            [IO.File]::WriteAllText($path, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))
          }

          $tab = "`t"
          $roleLine = $tab+$tab+$tab+$tab+$tab+'"role":         map[string]any{"type": "string", "minLength": 1},'
          $idAndRole = $tab+$tab+$tab+$tab+$tab+'"id":           map[string]any{"type": "string", "minLength": 1},'+"`n"+$roleLine
          Replace-Exact 'src/subagent_model.go' $roleLine $idAndRole

          $requiredOld = $tab+$tab+$tab+$tab+'"required":             []string{"role", "objective"},'
          $requiredNew = $tab+$tab+$tab+$tab+'"required":             []string{"id", "role", "objective"},'
          Replace-Exact 'src/subagent_model.go' $requiredOld $requiredNew

          Replace-Exact 'src/subagent_model.go' 'ROLE: PLANNER. Convert evidence into a small dependency-aware implementation plan. Use suggested_tasks for separable follow-up work. Proposals are data only and do not execute or grant capabilities.' 'ROLE: PLANNER. Convert evidence into a small dependency-aware implementation plan. Every suggested task requires a stable safe id plus role/objective; dependencies refer only to those ids. Proposals are data only and do not execute or grant capabilities.'

          $resultLine = $tab+$tab+$tab+'result := normalizeNativeChildResult(action.Result, task.Role)'
          $validation = $resultLine+"`n"+
            $tab+$tab+$tab+'if task.Role == AgentRolePlanner && len(result.SuggestedTasks) > 0 {'+"`n"+
            $tab+$tab+$tab+$tab+'if _, err := buildPlannerTaskGraph(task, result); err != nil {'+"`n"+
            $tab+$tab+$tab+$tab+$tab+'messages = append(messages, OllamaMessage{Role: "user", Content: "SYSTEM: Planner task graph rejected: " + err.Error() + ". Return a corrected finish result with stable task ids and an acyclic dependency graph."})'+"`n"+
            $tab+$tab+$tab+$tab+$tab+'continue'+"`n"+
            $tab+$tab+$tab+$tab+'}'+"`n"+
            $tab+$tab+$tab+'}'
          Replace-Exact 'src/subagent_model.go' $resultLine $validation

          $roleNormalize = $tab+$tab+'out.SuggestedTasks[i].Role = strings.TrimSpace(out.SuggestedTasks[i].Role)'
          $idRoleNormalize = $tab+$tab+'out.SuggestedTasks[i].ID = strings.TrimSpace(out.SuggestedTasks[i].ID)'+"`n"+$roleNormalize
          Replace-Exact 'src/subagent_model.go' $roleNormalize $idRoleNormalize

          $marshalLine = $tab+'data, err := json.MarshalIndent(payload, "", "  ")'
          $graphFormat = $tab+'if task.Role == AgentRolePlanner && len(result.SuggestedTasks) > 0 {'+"`n"+
            $tab+$tab+'if graph, err := buildPlannerTaskGraph(task, result); err == nil {'+"`n"+
            $tab+$tab+$tab+'payload["task_graph"] = graph'+"`n"+
            $tab+$tab+'} else {'+"`n"+
            $tab+$tab+$tab+'payload["task_graph_error"] = err.Error()'+"`n"+
            $tab+$tab+'}'+"`n"+
            $tab+'}'+"`n"+$marshalLine
          Replace-Exact 'src/subagent_model.go' $marshalLine $graphFormat

          $plannerJSONOld = '{"action":"finish","message":"Plan ready","result":{"summary":"Split implementation and verification.","suggested_tasks":[{"role":"builder","objective":"Implement the narrow code change","dependencies":[],"capabilities":["repository-read"]},{"role":"reviewer","objective":"Review the resulting diff","dependencies":["builder"]}]}}'
          $plannerJSONNew = '{"action":"finish","message":"Plan ready","result":{"summary":"Split implementation and verification.","suggested_tasks":[{"id":"build","role":"builder","objective":"Implement the narrow code change","dependencies":[],"capabilities":["repository-read"]},{"id":"review","role":"reviewer","objective":"Review the resulting diff","dependencies":["build"]}]}}'
          Replace-Exact 'src/subagent_model_test.go' $plannerJSONOld $plannerJSONNew
          Replace-Exact 'src/subagent_model_test.go' 'for _, marker := range []string{`"role": "planner"`, `"suggested_tasks"`, `"role": "builder"`, "Review the resulting diff"}' 'for _, marker := range []string{`"role": "planner"`, `"suggested_tasks"`, `"id": "build"`, `"task_graph"`, `"state": "ready"`, `"requested_capabilities"`, "Review the resulting diff"}'

          $graphPath = 'src/agent_task_graph.go'
          $graphText = [IO.File]::ReadAllText($graphPath)
          if ($graphText.Contains('func buildPlannerTaskGraph(')) { throw 'buildPlannerTaskGraph already exists unexpectedly' }
          $graphAppend = @'

func buildPlannerTaskGraph(parent AgentTask, result AgentResult) (AgentTaskGraph, error) {
	if parent.Role != AgentRolePlanner {
		return AgentTaskGraph{}, fmt.Errorf("task %q is not a planner", parent.ID)
	}
	missionID := strings.TrimSpace(parent.MissionID)
	if missionID == "" {
		missionID = strings.TrimSpace(parent.ID)
	}
	return buildAgentTaskGraph(missionID, strings.TrimSpace(parent.ID), result.SuggestedTasks)
}
'@
          [IO.File]::WriteAllText($graphPath, $graphText.TrimEnd() + $graphAppend + "`n", [Text.UTF8Encoding]::new($false))

          $testPath = 'src/subagent_model_test.go'
          $testText = [IO.File]::ReadAllText($testPath)
          if ($testText.Contains('func TestPlannerRejectsInvalidTaskGraphAndRequestsCorrection')) { throw 'planner correction test already exists unexpectedly' }
          $testAppend = @'

func TestPlannerRejectsInvalidTaskGraphAndRequestsCorrection(t *testing.T) {
	root := t.TempDir()
	if err := os.WriteFile(filepath.Join(root, "main.go"), []byte("package demo\n"), 0o644); err != nil {
		t.Fatal(err)
	}
	var calls atomic.Int32
	server := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
		step := calls.Add(1)
		action := `{"action":"finish","message":"Plan ready","result":{"summary":"Plan.","suggested_tasks":[{"id":"a","role":"builder","objective":"A","dependencies":["missing"]}]}}`
		if step > 1 {
			action = `{"action":"finish","message":"Corrected plan","result":{"summary":"Plan.","suggested_tasks":[{"id":"a","role":"builder","objective":"A"},{"id":"b","role":"reviewer","objective":"B","dependencies":["a"]}]}}`
		}
		_ = json.NewEncoder(w).Encode(OllamaChatResponse{Message: OllamaMessage{Role: "assistant", Content: action}, Done: true})
	}))
	defer server.Close()
	cfg := defaultConfig()
	ollama := &OllamaClient{BaseURL: server.URL, HTTP: server.Client(), ContextLength: 8192}
	state := NewAppState(cfg, ollama)
	t.Cleanup(state.Close)
	state.mu.Lock()
	state.Model = "fake-local-model"
	state.mu.Unlock()

	result, err := state.runReadOnlyModelSubagent(context.Background(), root, cfg, "plan a safe change", "planner")
	if err != nil {
		t.Fatal(err)
	}
	if calls.Load() != 2 {
		t.Fatalf("model calls=%d want 2 after invalid graph correction", calls.Load())
	}
	for _, marker := range []string{`"task_graph"`, `"id": "a"`, `"id": "b"`, `"dependencies": [`, `"a"`} {
		if !strings.Contains(result, marker) {
			t.Fatalf("corrected planner handoff missing %q:\n%s", marker, result)
		}
	}
}
'@
          [IO.File]::WriteAllText($testPath, $testText.TrimEnd() + $testAppend + "`n", [Text.UTF8Encoding]::new($false))

          gofmt -w src/agent_team_types.go src/agent_task_graph.go src/agent_task_graph_test.go src/subagent_model.go src/subagent_model_test.go
          git diff --check
          Push-Location src
          go test ./... -run 'TestAgentTask|TestBuildAgentTaskGraph|TestLegacyCompletedState|TestPlanner'
          Pop-Location

          git config user.name 'LocalCode CI'
          git config user.email 'localcode-ci@users.noreply.github.com'
          git add -- src/agent_team_types.go src/agent_task_graph.go src/agent_task_graph_test.go src/subagent_model.go src/subagent_model_test.go
          git diff --cached --check
          git commit -m 'feat: integrate planner proposals with task DAG'
          git push origin HEAD:feat/native-agent-task-dag
