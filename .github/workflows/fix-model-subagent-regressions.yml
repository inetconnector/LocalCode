name: Fix Model Subagent Regressions

on:
  push:
    branches: [agent/read-only-model-subagents]

permissions:
  contents: write

concurrency:
  group: fix-model-subagent-regressions
  cancel-in-progress: false

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Apply fix
        shell: pwsh
        run: |
          python scripts/fix-model-subagent-regressions.py
          gofmt -w src/agent.go src/subagent_model.go
          git diff --check
      - name: Commit fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- src/agent.go src/subagent_model.go)) { exit 0 }
          git config user.name 'localcode-ci'
          git config user.email 'localcode-ci@users.noreply.github.com'
          git add -- src/agent.go src/subagent_model.go
          git commit -m 'fix: keep subagent prompt within parent context budget'
          git push origin HEAD:agent/read-only-model-subagents
