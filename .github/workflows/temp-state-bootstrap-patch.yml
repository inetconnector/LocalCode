name: Temporary STATE bootstrap patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/native-agent-teams'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/native-agent-teams
          fetch-depth: 0
      - name: Add self-contained bootstrap invariant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Replace-Exact([string]$path, [string]$old, [string]$new) {
            $text = [IO.File]::ReadAllText($path)
            if ($text.Contains($new)) {
              Write-Host "Already patched: $path"
              return
            }
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne 1) { throw "Expected exactly one anchor in $path, found $count" }
            $text = $text.Replace($old, $new)
            [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          }

          $stateOld = '`STATE.md` and `TODO.md` MUST remain completely current and mutually consistent.'
          $stateNew = $stateOld + "`r`n`r`n**Self-contained AI bootstrap invariant:** `STATE.md` must be sufficient for a newly started AI with no chat history, memory, or prior context to understand the complete project state well enough to resume implementation immediately, safely, and correctly. It must therefore carry the current master/branch/PR/head/CI/review reality, product objective, architecture and core components, safety/Quality invariants, important files and entrypoints, relevant implemented capabilities, active changes, known problems and failed approaches, open decisions, exact next implementation steps, and the canonical relationship to `TODO.md`. Material facts that live in other documents must be summarized here with those source files named; bare links are not a substitute for working continuation context."
          Replace-Exact 'STATE.md' $stateOld $stateNew

          $todoOld = '`STATE.md` and `TODO.md` MUST remain completely current together.'
          $todoNew = $todoOld + "`r`n`r`n`STATE.md` is also the mandatory self-contained AI bootstrap: a newly started AI without chat history, memory, or prior context must be able to understand the complete project state and resume implementation from it immediately. `TODO.md` remains the exhaustive unfinished-work ledger, while `STATE.md` must summarize enough of the roadmap and exact next action to make continuation possible on its own."
          Replace-Exact 'TODO.md' $todoOld $todoNew

          git diff --check
          git config user.name 'LocalCode CI'
          git config user.email 'localcode-ci@users.noreply.github.com'
          git add -- STATE.md TODO.md
          git diff --cached --check
          git commit -m 'docs: make STATE a self-contained AI bootstrap'
          git push origin HEAD:feat/native-agent-teams
