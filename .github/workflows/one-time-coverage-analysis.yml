name: One-time coverage gap analysis

on:
  push:
    branches: [agent/security-quality-hardening]
    paths:
      - .github/workflows/one-time-coverage-analysis.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/go.mod
      - name: Generate coverage profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'localcode-coverage.out'
          Remove-Item -LiteralPath $profile -Force -ErrorAction SilentlyContinue
          go test ./... -count=1 -covermode=atomic "-coverprofile=$profile" -timeout=20m
          $testExit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $profile -PathType Leaf)) {
            throw "coverage profile missing after go test exit $testExit at $profile"
          }
          Write-Host "go test exit code: $testExit (profile: $profile)"
          "LOCALCODE_COVERAGE_PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0
      - name: Show coverage gaps
        shell: pwsh
        run: |
          $profile = $env:LOCALCODE_COVERAGE_PROFILE
          if (-not (Test-Path -LiteralPath $profile -PathType Leaf)) { throw "coverage profile missing: $profile" }
          $lines = & go tool cover ("-func=" + $profile)
          if ($LASTEXITCODE -ne 0) { throw 'go tool cover failed' }
          $lines | Write-Host
          $items = @()
          foreach ($line in $lines) {
            if ($line -match '^(.+?):(\d+):\s+([^\s]+)\s+([0-9.]+)%$') {
              $items += [pscustomobject]@{
                File = $matches[1]
                Line = [int]$matches[2]
                Function = $matches[3]
                Coverage = [double]$matches[4]
              }
            }
          }
          Write-Host "`n=== LOWEST COVERAGE FUNCTIONS ==="
          $items | Sort-Object Coverage, File, Line | Select-Object -First 160 | Format-Table -AutoSize | Out-String -Width 260 | Write-Host
          Write-Host "`n=== ZERO COVERAGE FUNCTIONS ==="
          $items | Where-Object Coverage -eq 0 | Sort-Object File, Line | Format-Table -AutoSize | Out-String -Width 260 | Write-Host
          Write-Host "`n=== LOW COVERAGE BY FILE ==="
          $items | Where-Object Coverage -lt 50 | Group-Object File | Sort-Object Count -Descending | Select-Object -First 40 Name,Count | Format-Table -AutoSize | Out-String -Width 260 | Write-Host
          $total = $lines | Where-Object { $_ -match '^total:' } | Select-Object -Last 1
          if (-not $total) { throw 'coverage total missing' }
          Write-Host "`n$total"
