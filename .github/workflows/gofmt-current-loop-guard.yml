name: Format current loop guard files

on:
  push:
    branches:
      - reliability/current-session-loop-guard
    paths:
      - .github/workflows/gofmt-current-loop-guard.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: reliability/current-session-loop-guard
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.13'
      - name: Format only loop-guard changes
        shell: bash
        run: |
          gofmt -w src/agent.go src/agent_loop_guard.go src/agent_loop_guard_test.go src/approval_precondition.go src/noop_edit_test.go src/tools.go
          git diff --check
          if git diff --quiet -- src; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent.go src/agent_loop_guard.go src/agent_loop_guard_test.go src/approval_precondition.go src/noop_edit_test.go src/tools.go
          git commit -m "style: format loop guard tests"
          git push origin HEAD:reliability/current-session-loop-guard
