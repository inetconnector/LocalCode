name: One-time shell policy migration

on:
  push:
    branches: [agent/security-quality-hardening]
    paths:
      - .github/workflows/one-time-shell-policy.yml

permissions:
  contents: write

concurrency:
  group: one-time-shell-policy-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replace unsafe free-form shell classifier
        shell: pwsh
        run: |
          $path = 'src/agent.go'
          $content = Get-Content -LiteralPath $path -Raw
          $pattern = '(?ms)^func commandLooksReadOnly\(command string\) bool \{.*?^func toolActionLooksReadOnly'
          $replacement = @(
            'func commandLooksReadOnly(command string) bool {'
            "`t// Free-form shell strings are not a safe read-only capability boundary."
            "`t// Redirection, chaining, shell expansion, project test hooks and tool"
            "`t// configuration can turn apparently harmless prefixes into mutations."
            "`t// Use structured run_tool/git actions for auto-approved read-only work."
            "`treturn false"
            '}'
            ''
            'func toolActionLooksReadOnly'
          ) -join "`n"
          $regex = [regex]::new($pattern)
          $updated = $regex.Replace($content, $replacement, 1)
          if ($updated -eq $content) {
            throw 'commandLooksReadOnly function boundary was not found; refusing non-deterministic patch.'
          }
          if ([regex]::Matches($updated, 'func commandLooksReadOnly\(').Count -ne 1) {
            throw 'Unexpected commandLooksReadOnly function count after migration.'
          }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $updated, [System.Text.UTF8Encoding]::new($false))
          gofmt -w $path
      - name: Verify conservative policy
        shell: pwsh
        working-directory: src
        run: go test ./... -run 'TestShellReadOnlyClassifierRejectsCompoundAndRedirectedCommands' -count=1
      - name: Commit migration and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/one-time-shell-policy.yml'
          git config user.name 'LocalCode Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: require approval for free-form shell commands'

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin agent/security-quality-hardening
            git rebase origin/agent/security-quality-hardening
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'Rebase failed; refusing to force-push the hardening branch.'
            }
            git push origin HEAD:agent/security-quality-hardening
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 2 }
          }
          throw 'Could not fast-forward push shell policy migration after three attempts.'
