name: One-time hardened-test alignment

on:
  push:
    branches: [agent/security-quality-hardening]
    paths:
      - .github/workflows/one-time-test-alignment.yml

permissions:
  contents: write

concurrency:
  group: one-time-hardened-test-alignment
  cancel-in-progress: false

jobs:
  align:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/go.mod

      - name: Remove stale tracked commit-message expectation
        shell: pwsh
        run: |
          $path = 'src/aider_engine_test.go'
          $content = Get-Content -LiteralPath $path -Raw
          $old = '"README.md", "STATE.md", "COMMIT_MESSAGE.txt", "NOTICE-AIDER.md",'
          $new = '"README.md", "STATE.md", "NOTICE-AIDER.md",'
          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
            [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))
            gofmt -w $path
          }

      - name: Add exact shell approval helper for agent tests
        shell: pwsh
        run: |
          @'
          // SPDX-License-Identifier: Apache-2.0

          package main

          // allowExactShellForTest models an explicit persisted user decision.
          // It keeps mocked agent tests deterministic without weakening the
          // production rule that free-form shell strings are never inferred safe.
          func allowExactShellForTest(cfg *Config, command string) {
          	cfg.ApprovalRules = append(cfg.ApprovalRules, ApprovalRule{
          		Scope:    "global",
          		Decision: "allow",
          		Pattern:  []string{"shell", command},
          	})
          }
          '@ | Set-Content -LiteralPath 'src/test_approval_helpers_test.go' -Encoding utf8NoBOM
          gofmt -w src/test_approval_helpers_test.go

      - name: Explicitly approve mocked verification shell commands
        shell: pwsh
        run: |
          $commands = @('echo test passed', 'echo lint passed', 'echo syntax ok')
          $functionRegex = [regex]::new('(?ms)^func Test\w+\(t \*testing\.T\) \{.*?(?=^func |\z)')
          $totalInsertions = 0

          foreach ($path in Get-ChildItem -LiteralPath 'src' -Filter '*_test.go') {
            $content = Get-Content -LiteralPath $path.FullName -Raw
            $updated = $functionRegex.Replace($content, {
              param($match)
              $block = $match.Value
              foreach ($command in $commands) {
                $jsonNeedle = '"command":"' + $command + '"'
                $helperNeedle = 'allowExactShellForTest(&cfg, "' + $command + '")'
                if (-not $block.Contains($jsonNeedle) -or $block.Contains($helperNeedle)) {
                  continue
                }
                $stateRegex = [regex]::new('(?m)^(\s*)state := NewAppState\(cfg,')
                $stateMatch = $stateRegex.Match($block)
                if (-not $stateMatch.Success) {
                  continue
                }
                $indent = $stateMatch.Groups[1].Value
                $insertion = $indent + 'allowExactShellForTest(&cfg, "' + $command + '")' + "`n" + $stateMatch.Value
                $block = $stateRegex.Replace($block, $insertion, 1)
                $script:totalInsertions++
              }
              return $block
            })
            if ($updated -ne $content) {
              [IO.File]::WriteAllText($path.FullName, $updated, [Text.UTF8Encoding]::new($false))
              gofmt -w $path.FullName
            }
          }

          if ($totalInsertions -lt 1) {
            throw 'No mocked verification shell command required explicit approval; expected at least one insertion.'
          }
          Write-Host "Inserted $totalInsertions exact shell approval rules."

      - name: Make terminal-command handler injectable for deterministic HTTP tests
        shell: pwsh
        run: |
          $path = 'src/server.go'
          $content = Get-Content -LiteralPath $path -Raw
          $marker = 'var launchTaskWindow = openBrowser'
          if (-not $content.Contains($marker)) { throw 'launchTaskWindow marker not found' }
          if (-not $content.Contains('var terminalCommandRunner = runProjectCommand')) {
            $content = $content.Replace($marker, $marker + "`nvar terminalCommandRunner = runProjectCommand")
          }
          $old = 'out, err := runProjectCommand(ctx, project, command, cfg)'
          $new = 'out, err := terminalCommandRunner(ctx, project, command, cfg)'
          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
          } elseif (-not $content.Contains($new)) {
            throw 'terminal command runner call not found'
          }
          [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))
          gofmt -w $path

      - name: Stub shell process only inside endpoint matrix
        shell: pwsh
        run: |
          $path = 'src/coverage_expansion_test.go'
          $content = Get-Content -LiteralPath $path -Raw
          if (-not $content.Contains('oldTerminalCommandRunner := terminalCommandRunner')) {
            $pattern = '(?m)^(\s*)rr = serveCoverageRequest\(t, server, http\.MethodPost, "/api/terminal-command", map\[string\]any\{"command": "echo hi", "path": project\}\)'
            $regex = [regex]::new($pattern)
            $match = $regex.Match($content)
            if (-not $match.Success) { throw 'terminal-command endpoint coverage call not found' }
            $indent = $match.Groups[1].Value
            $replacement = $indent + 'oldTerminalCommandRunner := terminalCommandRunner' + "`n" +
              $indent + 'terminalCommandRunner = func(ctx context.Context, project, command string, cfg Config) (string, error) {' + "`n" +
              $indent + "`treturn `"mock terminal command`", nil" + "`n" +
              $indent + '}' + "`n" +
              $indent + 'defer func() { terminalCommandRunner = oldTerminalCommandRunner }()' + "`n" +
              $match.Value
            $content = $regex.Replace($content, $replacement, 1)
            [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))
            gofmt -w $path
          }

      - name: Verify hardened-shell and endpoint regressions
        shell: pwsh
        working-directory: src
        run: |
          go test ./... -run 'TestAiderDocumentationAndLicenseFilesArePresent|TestAgent.*(InvalidAction|Placeholder|Completion|WrongFirstTool|RetriesIncomplete)|TestCoverageServerEndpointMatrix' -count=1 -timeout=12m

      - name: Compile entire test package
        shell: pwsh
        working-directory: src
        run: go test ./... -run '^$' -count=1

      - name: Commit alignment and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/one-time-test-alignment.yml'
          git config user.name 'LocalCode Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: align suite with hardened shell approvals'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin agent/security-quality-hardening
            git rebase origin/agent/security-quality-hardening
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'Rebase failed; refusing to force-push.'
            }
            git push origin HEAD:agent/security-quality-hardening
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 2 }
          }
          throw 'Could not fast-forward push test alignment.'
