name: Apply Agent Precondition Patch

on:
  push:
    branches: [agent/approval-bound-preconditions]

permissions:
  contents: write

concurrency:
  group: apply-agent-precondition-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        shell: pwsh
        run: |
          python scripts/apply-approval-precondition-patch.py
          gofmt -w src/agent.go
          git diff --check
      - name: Commit patched agent
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- src/agent.go)) {
            Write-Host 'agent.go already patched'
            exit 0
          }
          git config user.name 'localcode-ci'
          git config user.email 'localcode-ci@users.noreply.github.com'
          git add -- src/agent.go
          git commit -m 'feat: bind approvals to exact file versions'
          git push origin HEAD:agent/approval-bound-preconditions
