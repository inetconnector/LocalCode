name: One-time remote pairing response hardening

on:
  push:
    branches: [agent/security-quality-hardening]
    paths:
      - .github/workflows/one-time-remote-device-lifecycle.yml

permissions:
  contents: write

concurrency:
  group: one-time-remote-pairing-response-hardening
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/go.mod
      - name: Sanitize pairing response
        shell: pwsh
        run: |
          $path = 'src/remote_server.go'
          $content = Get-Content -LiteralPath $path -Raw
          $old = '_ = writeJSON(w, map[string]any{"ok": true, "token": token, "device": device})'
          $new = '_ = writeJSON(w, map[string]any{"ok": true, "token": token, "device": remoteDeviceView(device)})'
          if (-not $content.Contains($old)) { throw 'raw pairing response not found' }
          $content = $content.Replace($old, $new)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $content, [System.Text.UTF8Encoding]::new($false))
          gofmt -w $path
      - name: Verify remote lifecycle and sanitized response
        shell: pwsh
        working-directory: src
        run: go test ./... -run 'TestRemoteDevice|TestRemoteTokenExpires|TestRemotePairingTokenAndStatus|TestRemoteStreamTicket' -count=1 -timeout=10m
      - name: Verify no raw device serialization
        shell: pwsh
        run: |
          $remote = Get-Content -LiteralPath 'src/remote_server.go' -Raw
          if ($remote.Contains('"device": device')) { throw 'raw RemoteDevice still serialized' }
          if (-not $remote.Contains('"device": remoteDeviceView(device)')) { throw 'sanitized pairing response missing' }
      - name: Commit and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/one-time-remote-device-lifecycle.yml'
          git config user.name 'LocalCode Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: sanitize remote pairing device response'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin agent/security-quality-hardening
            git rebase origin/agent/security-quality-hardening
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'Rebase failed; refusing to force-push the hardening branch.'
            }
            git push origin HEAD:agent/security-quality-hardening
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 2 }
          }
          throw 'Could not fast-forward push remote pairing response hardening.'
