name: One-time config transaction migration

on:
  push:
    branches: [agent/security-quality-hardening]
    paths:
      - .github/workflows/one-time-config-transactions.yml

permissions:
  contents: write

concurrency:
  group: one-time-config-transaction-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/go.mod
      - name: Migrate persistent approval rules
        shell: pwsh
        run: |
          $path = 'src/approval_rules.go'
          $content = Get-Content -LiteralPath $path -Raw
          $pattern = '(?ms)\ts\.mu\.Lock\(\)\r?\n\tcfg := s\.Config\r?\n\tcfg\.ApprovalRules = normalizeApprovalRules\(append\(cfg\.ApprovalRules, rule\)\)\r?\n\ts\.mu\.Unlock\(\)\r?\n\tif err := saveConfig\(cfg\); err != nil \{\r?\n\t\treturn ApprovalRule\{\}, err\r?\n\t\}\r?\n\ts\.mu\.Lock\(\)\r?\n\ts\.Config = cfg\r?\n\ts\.mu\.Unlock\(\)'
          $replacement = @'
          	_, err = s.mutateConfig(func(cfg *Config) error {
          		cfg.ApprovalRules = normalizeApprovalRules(append(cfg.ApprovalRules, rule))
          		return nil
          	})
          	if err != nil {
          		return ApprovalRule{}, err
          	}
          '@
          $regex = [regex]::new($pattern)
          $updated = $regex.Replace($content, $replacement, 1)
          if ($updated -eq $content) { throw 'stale approval-rule config write pattern not found' }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $updated, [System.Text.UTF8Encoding]::new($false))
          gofmt -w $path
      - name: Migrate project catalog config writes
        shell: pwsh
        run: |
          $path = 'src/project_catalog.go'
          $content = Get-Content -LiteralPath $path -Raw
          $pattern = '(?ms)^func \(s \*AppState\) ProjectAction\(path, action, value string\) \(ProjectSummary, error\) \{.*?^func listHiddenProjects'
          $replacement = @'
          func (s *AppState) ProjectAction(path, action, value string) (ProjectSummary, error) {
          	path = strings.TrimSpace(path)
          	action = strings.ToLower(strings.TrimSpace(action))
          	value = strings.TrimSpace(value)
          	if path == "" {
          		return ProjectSummary{}, errors.New("project path is required")
          	}

          	s.mu.RLock()
          	running := s.Running
          	root := s.Config.RootProjectDir
          	s.mu.RUnlock()
          	if running {
          		return ProjectSummary{}, errors.New("Agent läuft gerade")
          	}

          	full, err := ensureWithinRoot(root, path)
          	if err != nil {
          		return ProjectSummary{}, err
          	}
          	info, err := os.Stat(full)
          	if err != nil || !info.IsDir() {
          		return ProjectSummary{}, errors.New("project directory not found")
          	}
          	if action == "rename" && len([]rune(value)) > 120 {
          		return ProjectSummary{}, errors.New("project name is too long")
          	}

          	removeActive := false
          	cfg, err := s.mutateConfig(func(cfg *Config) error {
          		if s.Running {
          			return errors.New("Agent läuft gerade")
          		}
          		switch action {
          		case "rename":
          			if cfg.ProjectAliases == nil {
          				cfg.ProjectAliases = map[string]string{}
          			}
          			for key := range cfg.ProjectAliases {
          				if strings.EqualFold(filepath.Clean(key), filepath.Clean(full)) {
          					delete(cfg.ProjectAliases, key)
          				}
          			}
          			if value != "" && !strings.EqualFold(value, filepath.Base(full)) {
          				cfg.ProjectAliases[full] = value
          			}
          		case "pin":
          			cfg.PinnedProjects = projectListWithout(cfg.PinnedProjects, full)
          			cfg.PinnedProjects = append(cfg.PinnedProjects, full)
          			cfg.HiddenProjects = projectListWithout(cfg.HiddenProjects, full)
          		case "unpin":
          			cfg.PinnedProjects = projectListWithout(cfg.PinnedProjects, full)
          		case "remove":
          			cfg.PinnedProjects = projectListWithout(cfg.PinnedProjects, full)
          			if !projectListContains(cfg.HiddenProjects, full) {
          				cfg.HiddenProjects = append(cfg.HiddenProjects, full)
          			}
          			removeActive = strings.EqualFold(filepath.Clean(s.Project), filepath.Clean(full))
          			if removeActive {
          				cfg.LastProject = ""
          			}
          		case "restore":
          			cfg.HiddenProjects = projectListWithout(cfg.HiddenProjects, full)
          		default:
          			return errors.New("unsupported project action")
          		}
          		return nil
          	})
          	if err != nil {
          		return ProjectSummary{}, err
          	}

          	if removeActive {
          		s.mu.Lock()
          		if strings.EqualFold(filepath.Clean(s.Project), filepath.Clean(full)) {
          			s.Project = ""
          			s.CurrentThread = ""
          			s.Events = nil
          			s.Pending = nil
          			s.Continuation = nil
          		}
          		s.mu.Unlock()
          	}

          	return ProjectSummary{Path: full, Name: projectDisplayName(cfg, full), Pinned: projectListContains(cfg.PinnedProjects, full)}, nil
          }

          func listHiddenProjects
          '@
          $regex = [regex]::new($pattern)
          $updated = $regex.Replace($content, $replacement, 1)
          if ($updated -eq $content) { throw 'ProjectAction function boundary not found' }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $updated, [System.Text.UTF8Encoding]::new($false))
          gofmt -w $path
      - name: Migrate settings and project selection
        shell: pwsh
        run: |
          $path = 'src/server.go'
          $content = Get-Content -LiteralPath $path -Raw

          $selectPattern = '(?ms)\ts\.state\.mu\.RLock\(\)\r?\n\tcfg := s\.state\.Config\r?\n\ts\.state\.mu\.RUnlock\(\)\r?\n\tcfg\.LastProject = full\r?\n\tif err := ensureProjectDocs\(full, cfg\); err != nil \{.*?\r?\n\t\}\r?\n\tif err := saveConfig\(cfg\); err != nil \{.*?\r?\n\t\}\r?\n\ts\.state\.selectProjectThread\(full\)\r?\n\ts\.state\.mu\.Lock\(\)\r?\n\ts\.state\.Config = cfg\r?\n\ts\.state\.mu\.Unlock\(\)'
          $selectReplacement = @'
          	s.state.mu.RLock()
          	cfg := s.state.Config
          	s.state.mu.RUnlock()
          	if err := ensureProjectDocs(full, cfg); err != nil {
          		http.Error(w, localizeConfigText(cfg, "Projektdokumentation konnte nicht vorbereitet werden: ", "Project documentation could not be prepared: ")+err.Error(), http.StatusInternalServerError)
          		return
          	}
          	cfg, err = s.state.mutateConfig(func(next *Config) error {
          		next.LastProject = full
          		return nil
          	})
          	if err != nil {
          		http.Error(w, localizeConfigText(cfg, "Projektauswahl konnte nicht gespeichert werden: ", "Project selection could not be saved: ")+err.Error(), http.StatusInternalServerError)
          		return
          	}
          	s.state.selectProjectThread(full)
          '@
          $selectRegex = [regex]::new($selectPattern)
          $updated = $selectRegex.Replace($content, $selectReplacement, 1)
          if ($updated -eq $content) { throw 'handleSelectProject stale config sequence not found' }
          $content = $updated

          $settingsPattern = '(?ms)\tcase http\.MethodPost:\r?\n\t\tvar patch map\[string\]json\.RawMessage.*?\r?\n\t\t_ = writeJSON\(w, map\[string\]any\{"ok": true, "settings": cfg\}\)\r?\n\tdefault:'
          $settingsReplacement = @'
          	case http.MethodPost:
          		var patch map[string]json.RawMessage
          		if err := readJSONPermissive(r.Body, &patch); err != nil {
          			http.Error(w, "Ungültige Einstellungsdaten: "+err.Error(), 400)
          			return
          		}
          		var previous Config
          		cfg, err := s.state.mutateConfig(func(current *Config) error {
          			previous = *current
          			baseData, err := json.Marshal(*current)
          			if err != nil {
          				return fmt.Errorf("Einstellungen konnten nicht serialisiert werden: %w", err)
          			}
          			var merged map[string]json.RawMessage
          			if err := json.Unmarshal(baseData, &merged); err != nil {
          				return fmt.Errorf("Einstellungen konnten nicht zusammengeführt werden: %w", err)
          			}
          			for key, value := range patch {
          				merged[key] = value
          			}
          			mergedData, err := json.Marshal(merged)
          			if err != nil {
          				return fmt.Errorf("Einstellungen konnten nicht zusammengeführt werden: %w", err)
          			}
          			var incoming Config
          			if err := json.Unmarshal(mergedData, &incoming); err != nil {
          				return fmt.Errorf("Einstellungen enthalten ungültige Werte: %w", err)
          			}
          			incoming.RootProjectDir = current.RootProjectDir
          			incoming.LastProject = current.LastProject
          			incoming.LastModel = current.LastModel
          			incoming.Port = current.Port
          			*current = incoming
          			return nil
          		})
          		if err != nil {
          			if isConfigMutationError(err) {
          				http.Error(w, err.Error(), http.StatusBadRequest)
          			} else {
          				http.Error(w, localizeConfigText(previous, "Einstellungen konnten nicht gespeichert werden: ", "Settings could not be saved: ")+err.Error(), http.StatusInternalServerError)
          			}
          			return
          		}
          		s.state.mu.Lock()
          		if cfg.OllamaURL != "" {
          			s.state.Ollama.BaseURL = cfg.OllamaURL
          		} else {
          			s.state.Ollama.BaseURL = firstOllamaCandidate()
          		}
          		s.state.Ollama.ContextLength = cfg.ContextLength
          		s.state.mu.Unlock()
          		defaultMCPManager.Close()
          		s.state.UpdateProjectState(localizeConfigText(cfg, "Einstellungen geändert", "Settings changed"))
          		w.Header().Set("Content-Type", "application/json")
          		_ = writeJSON(w, map[string]any{"ok": true, "settings": cfg})
          	default:
          '@
          $settingsRegex = [regex]::new($settingsPattern)
          $updated = $settingsRegex.Replace($content, $settingsReplacement, 1)
          if ($updated -eq $content) { throw 'handleSettings POST boundary not found' }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $updated, [System.Text.UTF8Encoding]::new($false))
          gofmt -w $path
      - name: Add cross-path concurrency regression
        shell: pwsh
        run: |
          @'
          // SPDX-License-Identifier: Apache-2.0

          package main

          import (
          	"net/http"
          	"net/http/httptest"
          	"strings"
          	"sync"
          	"testing"
          )

          func TestSettingsAndApprovalRuleDoNotLoseEachOther(t *testing.T) {
          	state := newConfigTransactionTestState(t)
          	server := NewServer(state)
          	start := make(chan struct{})
          	var wg sync.WaitGroup
          	wg.Add(2)
          	errCh := make(chan error, 1)

          	go func() {
          		defer wg.Done()
          		<-start
          		_, err := state.addApprovalRule("", AgentAction{Action: "git", Args: []string{"status"}}, "global")
          		if err != nil { errCh <- err }
          	}()
          	go func() {
          		defer wg.Done()
          		<-start
          		req := httptest.NewRequest(http.MethodPost, "http://127.0.0.1/api/settings", strings.NewReader(`{"ui_accent":"#123456"}`))
          		req.Host = "127.0.0.1"
          		rr := httptest.NewRecorder()
          		server.ServeHTTP(rr, req)
          		if rr.Code != http.StatusOK { errCh <- &statusCodeError{code: rr.Code, body: rr.Body.String()} }
          	}()
          	close(start)
          	wg.Wait()
          	close(errCh)
          	for err := range errCh { t.Fatal(err) }

          	state.mu.RLock()
          	cfg := state.Config
          	state.mu.RUnlock()
          	if cfg.UIAccent != "#123456" { t.Fatalf("settings update lost: %q", cfg.UIAccent) }
          	if len(cfg.ApprovalRules) == 0 { t.Fatal("approval rule update lost") }
          }

          type statusCodeError struct { code int; body string }
          func (e *statusCodeError) Error() string { return http.StatusText(e.code) + ": " + e.body }
          '@ | Set-Content -LiteralPath 'src/config_concurrency_integration_test.go' -Encoding utf8NoBOM
          gofmt -w src/config_concurrency_integration_test.go
      - name: Verify config transaction migration
        shell: pwsh
        working-directory: src
        run: |
          go test ./... -run 'TestMutateConfig|TestSettingsAndApprovalRuleDoNotLoseEachOther' -count=1 -timeout=10m
          go test ./... -run '^$' -count=1
      - name: Commit migration and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/one-time-config-transactions.yml'
          git config user.name 'LocalCode Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: serialize AppState configuration updates'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin agent/security-quality-hardening
            git rebase origin/agent/security-quality-hardening
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'Rebase failed; refusing to force-push the hardening branch.'
            }
            git push origin HEAD:agent/security-quality-hardening
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 2 }
          }
          throw 'Could not fast-forward push config transaction migration.'
