name: Native Agent Teams PR Patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/native-agent-teams'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/native-agent-teams
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.13'
          cache-dependency-path: src/go.mod
      - name: Apply assertions-guarded integration patch
        shell: pwsh
        run: ./scripts/temp-native-agent-teams-run.ps1
      - name: Targeted child-agent tests
        shell: pwsh
        working-directory: src
        run: go test ./... -run 'Test(NativeChild|AgentRoles|ExecuteNativeChild|MandatoryReliabilityPreflight|ModelExplorer|PlannerCan)' -count=1 -timeout=8m
      - name: Commit current-master integration
        shell: pwsh
        run: |
          $paths = @('src/agent.go','src/agent_supervisor.go','src/edit_reliability.go','src/agent_team_types.go','src/subagent_model.go','src/subagent_model_test.go','README.md','docs/ARCHITECTURE.md','docs/SECURITY.md')
          git add -- $paths
          if (-not (git diff --cached --quiet)) {
            git config user.name 'LocalCode CI'
            git config user.email 'localcode-ci@users.noreply.github.com'
            git diff --cached --check
            git commit -m 'feat: add bounded native child-agent roles'
            git push origin HEAD:feat/native-agent-teams
          } else {
            Write-Host 'Integration patch already applied; nothing to push.'
          }
