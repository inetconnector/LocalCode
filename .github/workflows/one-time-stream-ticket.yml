name: One-time remote stream ticket migration

on:
  push:
    branches: [agent/security-quality-hardening]
    paths:
      - .github/workflows/one-time-stream-ticket.yml

permissions:
  contents: write

concurrency:
  group: one-time-remote-stream-ticket-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Route SSE through one-time tickets
        shell: pwsh
        run: |
          $serverPath = 'src/remote_server.go'
          $server = Get-Content -LiteralPath $serverPath -Raw
          $oldRoutes = @'
          	s.mux.HandleFunc("/remote/api/stop", s.withAuth(s.handleStop))
          	s.mux.HandleFunc("/remote/api/events", s.withAuth(s.handleEvents))
          '@
          $newRoutes = @'
          	s.mux.HandleFunc("/remote/api/stop", s.withAuth(s.handleStop))
          	s.mux.HandleFunc("/remote/api/event-ticket", s.withAuth(s.handleEventTicket))
          	s.mux.HandleFunc("/remote/api/events", s.withStreamTicket(s.handleEvents))
          '@
          if (-not $server.Contains($oldRoutes)) { throw 'Remote route block not found' }
          $server = $server.Replace($oldRoutes, $newRoutes)

          $legacyQuery = @'
          		// EventSource cannot attach custom headers. Keep the legacy query-token
          		// path narrowly scoped to SSE until the remote client is migrated to
          		// short-lived stream tickets; all ordinary API calls require headers.
          		if token == "" && r.URL.Path == "/remote/api/events" {
          			token = strings.TrimSpace(r.URL.Query().Get("token"))
          		}
          '@
          if (-not $server.Contains($legacyQuery)) { throw 'Legacy SSE query-token block not found' }
          $server = $server.Replace($legacyQuery, '')
          [System.IO.File]::WriteAllText((Resolve-Path $serverPath), $server, [System.Text.UTF8Encoding]::new($false))
          gofmt -w $serverPath

          $htmlPath = 'src/static/remote.html'
          $html = Get-Content -LiteralPath $htmlPath -Raw
          $pattern = 'function connectEvents\(\)\{.*?\}\r?\n\$\(''#pairBtn''\)'
          $replacement = @'
          async function connectEvents(){if(state.es)state.es.close();if(!state.token)return;try{const stream=await api('/remote/api/event-ticket',{method:'POST'});const es=new EventSource('/remote/api/events?ticket='+encodeURIComponent(stream.ticket));state.es=es;es.onmessage=e=>{const ev=JSON.parse(e.data);if(ev.thread_id&&state.currentThread&&ev.thread_id!==state.currentThread)return;state.events.push(ev);if(ev.type==='approval_required'){state.pending=ev;showView('approve')}if(ev.type==='approval')state.pending=null;if(ev.type==='status')refresh();render()};es.onerror=()=>{es.close();if(state.es===es)setTimeout(connectEvents,1800)}}catch(e){console.warn(e);setTimeout(connectEvents,1800)}}
          $('#pairBtn')
          '@
          $updatedHtml = [regex]::Replace($html, $pattern, $replacement, 1, [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if ($updatedHtml -eq $html) { throw 'Remote connectEvents function not found' }
          if ($updatedHtml.Contains('/remote/api/events?token=')) { throw 'Long-lived token still appears in SSE URL' }
          [System.IO.File]::WriteAllText((Resolve-Path $htmlPath), $updatedHtml, [System.Text.UTF8Encoding]::new($false))
      - name: Add stream ticket regression tests
        shell: pwsh
        run: |
          @'
          // SPDX-License-Identifier: Apache-2.0

          package main

          import (
          	"encoding/json"
          	"net/http"
          	"net/http/httptest"
          	"testing"
          	"time"
          )

          func TestRemoteStreamTicketIsSingleUse(t *testing.T) {
          	resetRemoteStreamTicketsForTest()
          	t.Cleanup(resetRemoteStreamTicketsForTest)
          	ticket, expires, err := issueRemoteStreamTicket()
          	if err != nil { t.Fatal(err) }
          	if ticket == "" || !expires.After(time.Now()) { t.Fatal("invalid stream ticket") }
          	if !consumeRemoteStreamTicket(ticket) { t.Fatal("fresh stream ticket rejected") }
          	if consumeRemoteStreamTicket(ticket) { t.Fatal("stream ticket reused") }
          }

          func TestRemoteStreamTicketExpires(t *testing.T) {
          	resetRemoteStreamTicketsForTest()
          	t.Cleanup(resetRemoteStreamTicketsForTest)
          	ticket, _, err := issueRemoteStreamTicket()
          	if err != nil { t.Fatal(err) }
          	hash := remoteStreamTicketHash(ticket)
          	remoteStreamTicketStore.Lock()
          	remoteStreamTicketStore.tickets[hash] = time.Now().Add(-time.Second)
          	remoteStreamTicketStore.Unlock()
          	if consumeRemoteStreamTicket(ticket) { t.Fatal("expired stream ticket accepted") }
          }

          func TestRemoteEventTicketRequiresAuthentication(t *testing.T) {
          	resetRemoteStreamTicketsForTest()
          	t.Cleanup(resetRemoteStreamTicketsForTest)
          	state := newRemoteTestState(t)
          	remote := NewRemoteServer(state)
          	if rr := serveHTTP(remote, http.MethodPost, "/remote/api/event-ticket", "", ""); rr.Code != http.StatusUnauthorized {
          		t.Fatalf("unauthenticated ticket status = %d", rr.Code)
          	}
          	code, _, _, err := state.StartRemotePairing()
          	if err != nil { t.Fatal(err) }
          	token, _, err := state.PairRemoteDevice(code, "phone")
          	if err != nil { t.Fatal(err) }
          	rr := serveHTTP(remote, http.MethodPost, "/remote/api/event-ticket", "", token)
          	if rr.Code != http.StatusOK { t.Fatalf("ticket status = %d body=%s", rr.Code, rr.Body.String()) }
          	var body struct { Ticket string `json:"ticket"` }
          	if err := json.Unmarshal(rr.Body.Bytes(), &body); err != nil { t.Fatal(err) }
          	if body.Ticket == "" || !consumeRemoteStreamTicket(body.Ticket) { t.Fatal("issued ticket not registered") }
          }

          func TestRemoteSSERejectsDeviceTokenInQuery(t *testing.T) {
          	resetRemoteStreamTicketsForTest()
          	t.Cleanup(resetRemoteStreamTicketsForTest)
          	state := newRemoteTestState(t)
          	code, _, _, err := state.StartRemotePairing()
          	if err != nil { t.Fatal(err) }
          	token, _, err := state.PairRemoteDevice(code, "phone")
          	if err != nil { t.Fatal(err) }
          	req := httptest.NewRequest(http.MethodGet, "http://127.0.0.1/remote/api/events?token="+token, nil)
          	req.Host = "127.0.0.1"
          	rr := httptest.NewRecorder()
          	NewRemoteServer(state).ServeHTTP(rr, req)
          	if rr.Code != http.StatusUnauthorized { t.Fatalf("device query token SSE status = %d", rr.Code) }
          }
          '@ | Set-Content -LiteralPath 'src/remote_stream_ticket_test.go' -Encoding utf8NoBOM
          gofmt -w src/remote_stream_ticket_test.go
      - name: Verify remote stream ticket migration
        shell: pwsh
        working-directory: src
        run: go test ./... -run 'TestRemoteStreamTicket|TestRemoteEventTicket|TestRemoteSSERejectsDeviceTokenInQuery|TestRemotePairingTokenAndStatus' -count=1
      - name: Commit migration and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/one-time-stream-ticket.yml'
          git config user.name 'LocalCode Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: replace SSE device token with one-time ticket'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin agent/security-quality-hardening
            git rebase origin/agent/security-quality-hardening
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'Rebase failed; refusing to force-push the hardening branch.'
            }
            git push origin HEAD:agent/security-quality-hardening
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 2 }
          }
          throw 'Could not fast-forward push stream-ticket migration.'
