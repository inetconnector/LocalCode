name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.13'
          cache-dependency-path: src/go.mod

      - name: Go version
        run: go version

      - name: Resolve Go module checksums
        shell: pwsh
        run: |
          go mod download all
          if ($LASTEXITCODE -ne 0) { throw 'go mod download failed' }
          Write-Host '--- BEGIN GENERATED GO.SUM ---'
          Get-Content -LiteralPath go.sum
          Write-Host '--- END GENERATED GO.SUM ---'

      - name: Format check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.go | ForEach-Object FullName
          if ($files.Count -gt 0) {
            $bad = gofmt -l $files
            if ($bad) { Write-Error "gofmt required:`n$bad" }
          }

      - name: Vet
        run: go vet ./...

      - name: Frontend JavaScript syntax
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $javascriptFiles = Get-ChildItem -LiteralPath src/static -Filter *.js -File | ForEach-Object FullName
          foreach ($javascriptPath in $javascriptFiles) {
            node --check $javascriptPath
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $javascriptPath" }
          }
          foreach ($htmlPath in @('src/static/index.html', 'src/static/remote.html')) {
            $html = Get-Content -LiteralPath $htmlPath -Raw
            $matches = [regex]::Matches($html, '(?is)<script(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script>')
            if ($matches.Count -eq 0) { throw "No inline script found in $htmlPath" }
            for ($i = 0; $i -lt $matches.Count; $i++) {
              $tmp = Join-Path $env:RUNNER_TEMP ((Split-Path $htmlPath -Leaf) + ".inline.$i.js")
              [IO.File]::WriteAllText($tmp, $matches[$i].Groups[1].Value, [Text.UTF8Encoding]::new($false))
              node --check $tmp
              if ($LASTEXITCODE -ne 0) { throw "Inline JavaScript syntax failed: $htmlPath script $i" }
            }
          }

      - name: Native Android Remote APK
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/build-android.ps1

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Full-stack loopback HTTP integration
        run: go test ./... -run '^TestFullStackLoopbackDesktopAndRemoteHTTP$' -count=1 -timeout=5m

      - name: Tests
        run: go test ./... -count=1 -timeout=20m

      - name: Race detector
        run: go test ./... -race -count=1 -timeout=25m

      - name: Coverage
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'localcode-quality-coverage.out'
          Remove-Item -LiteralPath $profile -Force -ErrorAction SilentlyContinue
          go test ./... -count=1 -covermode=atomic "-coverprofile=$profile" -timeout=20m
          if ($LASTEXITCODE -ne 0) { throw 'Coverage test run failed' }
          if (-not (Test-Path -LiteralPath $profile -PathType Leaf)) { throw "Coverage profile missing: $profile" }
          $report = & go tool cover ("-func=" + $profile)
          if ($LASTEXITCODE -ne 0) { throw 'go tool cover failed' }
          $report | Write-Host
          $line = $report | Where-Object { $_ -match '^total:' } | Select-Object -Last 1
          if (-not $line) { throw 'Coverage total missing' }
          if ($line -notmatch '([0-9]+(?:\.[0-9]+)?)%\s*$') { throw "Could not parse coverage total: $line" }
          $pct = [double]$matches[1]
          Write-Host "Statement coverage: $pct%"
          if ($pct -lt 80.0) { throw "Coverage $pct% is below 80.0% gate" }

      - name: Native Windows builds
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath '../VERSION.txt' -Raw).Trim()
          $gui = Join-Path $env:RUNNER_TEMP 'LocalCode.exe'
          $debug = Join-Path $env:RUNNER_TEMP 'LocalCode-Debug.exe'
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$version" -o $gui .
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI build failed' }
          go build -trimpath -ldflags "-X main.version=$version-debug" -o $debug .
          if ($LASTEXITCODE -ne 0) { throw 'Windows diagnostics build failed' }
          if (-not (Test-Path -LiteralPath $gui -PathType Leaf) -or -not (Test-Path -LiteralPath $debug -PathType Leaf)) {
            throw 'Expected Windows build artifact missing'
          }

      - name: Git diff check
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git diff --check
