name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: true
          cache-dependency-path: src/go.mod
      - name: Go version
        run: go version
      - name: Format check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.go | ForEach-Object FullName
          if ($files.Count -gt 0) {
            $bad = gofmt -l $files
            if ($bad) { Write-Error "gofmt required:`n$bad" }
          }
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./... -count=1 -timeout=20m
      - name: Race detector
        run: go test ./... -race -count=1 -timeout=25m
      - name: Coverage
        shell: pwsh
        run: |
          go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out -timeout=20m
          $line = go tool cover -func=coverage.out | Select-String '^total:'
          if (-not $line) { throw 'Coverage total missing' }
          $pct = [double](($line.ToString() -split '\s+')[-1].TrimEnd('%'))
          Write-Host "Statement coverage: $pct%"
          if ($pct -lt 80.0) { throw "Coverage $pct% is below 80.0% gate" }
      - name: Git diff check
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git diff --check
