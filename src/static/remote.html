<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>LocalCode Remote</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d0d0d;
  --surface:#171717;
  --panel:#212121;
  --card:#2f2f2f;
  --card-hover:#383838;
  --border:rgba(255,255,255,0.08);
  --border-focus:rgba(255,255,255,0.25);
  --text:#f5f5f5;
  --text-muted:#8e8e8e;
  --text-soft:#666666;
  --accent:#ffffff;
  --accent-invert:#000000;
  --openai-teal:#10a37f;
  --danger:#ef4444;
  --danger-bg:#3d1a1c;
  --ok:#22c55e;
  --warn:#f59e0b;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --code:"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  --radius-pill:9999px;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.5 var(--font);touch-action:manipulation}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
.hidden{display:none!important}

/* Main App Layout */
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg);position:relative;overflow:hidden}

/* OpenAI-Style Header */
.top{
  height:calc(56px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 12px 0;
  background:rgba(13,13,13,0.85);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  z-index:20;
}
.header-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--text);
  transition:background .15s;
}
.header-btn:active{background:var(--panel)}
.header-btn svg{width:22px;height:22px;fill:currentColor}

/* Model / Project Pill in Header */
.model-pill-btn{
  height:36px;
  padding:0 14px;
  border-radius:var(--radius-pill);
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:600;
  font-size:14px;
  color:var(--text);
  max-width:200px;
}
.model-pill-btn:active{background:var(--panel)}
.model-pill-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-soft);flex-shrink:0}
.status-dot.on{background:var(--ok)}
.status-dot.warn{background:var(--warn)}
.gear-btn{display:none} /* Backward compatibility ref */

/* Navigation Tabs Bar (Desktop/Swipeable) */
.tabs{
  height:40px;
  background:var(--surface);
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 12px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  height:28px;
  border-radius:var(--radius-pill);
  background:transparent;
  color:var(--text-muted);
  font-size:13px;
  font-weight:600;
  padding:0 12px;
  white-space:nowrap;
  transition:all .15s;
}
.tab.active{background:var(--panel);color:var(--text)}

/* Sidebar Drawer (ChatGPT-Style) */
.drawer-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  z-index:90;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(320px,85vw);
  background:#171717;
  border-right:1px solid var(--border);
  z-index:100;
  transform:translateX(-100%);
  transition:transform .28s cubic-bezier(0.16,1,0.3,1);
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
.drawer.open{transform:translateX(0)}
.drawer-header{
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.drawer-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.drawer-search{
  margin:12px 14px 6px;
  height:40px;
  background:#212121;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:0 12px;
  font-size:14px;
  color:var(--text);
  outline:none;
}
.drawer-search:focus{border-color:var(--border-focus)}
.drawer-content{
  flex:1;
  overflow-y:auto;
  padding:8px 12px;
  scrollbar-width:none;
}
.drawer-content::-webkit-scrollbar{display:none}
.drawer-section-title{
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:16px 8px 6px;
}
.drawer-item{
  width:100%;
  min-height:42px;
  padding:8px 10px;
  border-radius:var(--radius-md);
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  font-size:14px;
  color:var(--text);
  transition:background .12s;
}
.drawer-item:active,.drawer-item.active{background:#262626}
.drawer-item-icon{font-size:16px;width:24px;text-align:center;color:var(--text-muted);flex-shrink:0}
.drawer-item-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.drawer-item-meta{font-size:12px;color:var(--text-muted)}
.drawer-footer{
  padding:12px 14px;
  border-top:1px solid var(--border);
  background:#141414;
}

/* Chat & Views Container */
.main{min-height:0;overflow:hidden;position:relative;height:100%}
.view{
  height:100%;
  overflow-y:auto;
  padding:16px 14px 160px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.view::-webkit-scrollbar{display:none}

/* Empty State */
.empty{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  color:var(--text-muted);
}
.empty-logo{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  display:grid;
  place-items:center;
  margin-bottom:14px;
  color:var(--text);
}
.empty h1{margin:0 0 6px;color:#fff;font-size:24px;font-weight:700}
.empty p{margin:0;font-size:15px;line-height:1.5;max-width:280px}

/* Chat Bubbles (OpenAI Style) */
.bubble-row{display:flex;margin:16px 0;gap:10px}
.bubble-row.user{justify-content:flex-end}
.bubble{max-width:86%;word-break:break-word;line-height:1.55}
.bubble-row.user .bubble{
  background:var(--card);
  color:#ffffff;
  border-radius:20px;
  padding:11px 16px;
  font-size:15.5px;
}
.bubble-row.agent .bubble{
  font-size:15.5px;
  color:#f4f4f5;
  width:100%;
  max-width:100%;
}
.inline-code{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  padding:2px 6px;
  border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:13px;
  color:#38bdf8;
}
.bubble ul, .bubble ol{margin:6px 0;padding-left:22px}
.bubble li{margin:3px 0}
.bubble a{color:#38bdf8;text-decoration:underline;text-underline-offset:3px}
.bubble strong{font-weight:700;color:#ffffff}
.bubble em{font-style:italic;color:#e4e4e7}

.code{
  margin:10px 0;
  background:#09090b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:12px;
  font:13px/1.45 var(--code);
  color:#e4e4e7;
  overflow-x:auto;
  white-space:pre;
  position:relative;
}
.code-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  padding-bottom:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:12px;
  color:var(--text-muted);
}
.copy-code-btn{
  font-size:11px;
  padding:3px 8px;
  border-radius:6px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  color:#f4f4f5;
  font-weight:500;
  cursor:pointer;
  transition:all .15s;
}
.copy-code-btn:active{transform:scale(0.95)}

/* Colored Git Diff Box */
.diff-box{
  background:#09090b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:12px;
  line-height:1.5;
  margin:10px 0;
  padding:6px 0;
}
.diff-line{display:flex;padding:2px 10px;white-space:pre-wrap;word-break:break-all}
.diff-line.diff-add{background:rgba(34,197,94,0.12);color:#4ade80}
.diff-line.diff-del{background:rgba(239,68,68,0.12);color:#f87171}
.diff-line.diff-hunk{background:rgba(56,189,248,0.08);color:#38bdf8;font-style:italic}
.diff-line.diff-meta{color:#a1a1aa;font-weight:600;background:rgba(255,255,255,0.02)}
.diff-line.diff-ctx{color:#d4d4d8}
.diff-sign{width:16px;user-select:none;flex-shrink:0;opacity:0.8;font-weight:bold}
.diff-text{flex:1;min-width:0}

/* Starter Quick Cards */
.new-hero{
  text-align:center;
  padding:20px 0 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.new-hero .empty-logo{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  display:grid;
  place-items:center;
  margin-bottom:12px;
  color:#fff;
}
.new-hero h1{font-size:22px;font-weight:700;margin:0 0 6px;color:#fff;letter-spacing:-0.02em}
.new-hero p{font-size:13.5px;color:#a1a1aa;margin:0}
.starter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
  width:100%;
}
.starter-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:12px;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:6px;
  transition:all .15s ease;
  cursor:pointer;
  color:inherit;
}
.starter-card:active{
  background:rgba(255,255,255,0.08);
  border-color:rgba(255,255,255,0.18);
  transform:scale(0.98);
}
.starter-icon{font-size:20px}
.starter-title{font-size:13px;font-weight:600;color:#f4f4f5}
.starter-desc{font-size:11.5px;color:#71717a;line-height:1.35}

/* Scroll To Bottom Button */
.scroll-bottom-btn{
  position:absolute;
  bottom:92px;
  right:20px;
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(39,39,42,0.92);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.15);
  color:#f4f4f5;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  cursor:pointer;
  z-index:40;
  transition:opacity .2s, transform .2s;
}
.scroll-bottom-btn.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
.scroll-bottom-btn:active{transform:scale(0.95)}

.event-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.event-chip{
  display:inline-flex;
  border-radius:var(--radius-sm);
  background:var(--panel);
  padding:3px 8px;
  color:var(--text-muted);
  font-size:12px;
  border:1px solid var(--border);
}

/* Tool Accordion Step */
.tool-step{
  background:#141414;
  border:1px solid #242424;
  border-radius:var(--radius-md);
  padding:8px 12px;
  margin:8px 0;
  font-size:13.5px;
}
.event-summary{
  cursor:pointer;
  color:var(--text-muted);
  list-style:none;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:500;
}
.tool-chevron{display:inline-block;transition:transform .2s;font-size:12px}
.tool-step[open] .event-summary{color:var(--text);margin-bottom:8px}
.tool-step[open] .tool-chevron{transform:rotate(90deg)}
.final-result .bubble{
  border-left:3px solid var(--ok);
  background:rgba(34,197,94,0.06);
  padding:10px 14px;
  border-radius:var(--radius-md);
}

/* Approval Popup */
.approval-modal{
  position:fixed;
  inset:0;
  z-index:110;
  display:grid;
  place-items:center;
  padding:24px 18px calc(24px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,0.68);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.approval-dialog{
  width:min(480px,100%);
}
.approval-card{
  background:#1f190e;
  border:1px solid #5a4216;
  border-radius:var(--radius-lg);
  padding:16px;
  margin:0;
  box-shadow:0 18px 60px rgba(0,0,0,0.58);
}
.approval-card h2{font-size:16px;margin:0 0 6px;color:#fef08a}
.approval-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.approval-actions button{height:42px;border-radius:var(--radius-md);font-weight:700;font-size:14px}
.approve{background:#ffffff;color:#000000}
.always{background:#2563eb;color:#ffffff}
.reject{background:var(--danger-bg);color:#fca5a5;border:1px solid #7f1d1d!important}

/* Project & Management Cards */
.action-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px;
  margin:12px 0;
}
.action-card h2{font-size:17px;margin:0 0 4px}
.action-card p{font-size:13px;color:var(--text-muted);margin:0 0 12px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action-grid button{
  min-height:44px;
  border-radius:12px;
  font-weight:600;
  font-size:13.5px;
  padding:8px 12px;
  background:rgba(255, 255, 255, 0.06);
  border:1px solid rgba(255, 255, 255, 0.08);
  color:#f4f4f5;
  transition:all .15s;
}
.action-grid button:active{transform:scale(0.98)}
.action-grid .primary{
  background:#ffffff;
  border-color:#ffffff;
  color:#000000;
}
.action-grid .danger{
  background:rgba(239, 68, 68, 0.1);
  color:#f87171;
  border:1px solid rgba(239, 68, 68, 0.25);
}
.action-grid .store{
  grid-column:1/-1;
  background:rgba(56, 189, 248, 0.12);
  border:1px solid rgba(56, 189, 248, 0.28);
  color:#38bdf8;
  font-weight:600;
}
.action-grid .trash{
  background:rgba(255, 255, 255, 0.06);
  border:1px solid rgba(255, 255, 255, 0.08);
  color:#f4f4f5;
}
.selected-project{
  font-size:12.5px;
  line-height:1.45;
  word-break:break-all;
  color:#a1a1aa;
  background:rgba(255, 255, 255, 0.03);
  border-radius:12px;
  padding:10px 12px;
  margin-top:12px;
  border:1px dashed rgba(255, 255, 255, 0.12);
  text-align:center;
}
.row{
  border:1px solid rgba(255, 255, 255, 0.04);
  background:rgba(255, 255, 255, 0.02);
  width:100%;
  min-height:54px;
  padding:10px 12px;
  display:flex;
  gap:12px;
  align-items:center;
  text-align:left;
  border-radius:14px;
  margin-bottom:6px;
  transition:background .15s, border-color .15s;
}
.row:active{
  background:rgba(255, 255, 255, 0.08);
  border-color:rgba(255, 255, 255, 0.15);
}
.row-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:rgba(255, 255, 255, 0.08);
  border:1px solid rgba(255, 255, 255, 0.06);
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:12px;
  color:#a1a1aa;
  flex-shrink:0;
}
.row-main{min-width:0;flex:1}
.row-title{font-weight:600;font-size:14.5px;color:#f4f4f5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12px;color:#71717a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:13px;font-weight:bold;color:#38bdf8}

/* Trash Cards */
.trash-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px;
  margin:12px 0;
}
.trash-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.trash-actions button{
  min-height:40px;
  border-radius:10px;
  background:rgba(255, 255, 255, 0.08);
  border:1px solid rgba(255, 255, 255, 0.12);
  color:#f4f4f5;
  font-weight:600;
  font-size:13px;
  transition:all .15s;
}
.trash-actions button:active{transform:scale(0.98)}
.trash-actions .purge{
  background:rgba(239, 68, 68, 0.1);
  color:#f87171;
  border:1px solid rgba(239, 68, 68, 0.25);
}


/* Codex-Style Floating Composer */
.composer{
  position:absolute;
  left:12px;
  right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom));
  background:rgba(28, 28, 30, 0.92);
  -webkit-backdrop-filter:blur(24px);
  backdrop-filter:blur(24px);
  border:1px solid rgba(255, 255, 255, 0.12);
  border-radius:26px;
  padding:10px 12px 10px 14px;
  box-shadow:0 12px 36px rgba(0, 0, 0, 0.65), 0 2px 10px rgba(0, 0, 0, 0.4);
  z-index:30;
  display:flex;
  flex-direction:column;
  gap:6px;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.composer:focus-within{
  border-color:rgba(255, 255, 255, 0.28);
  box-shadow:0 16px 44px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.12);
}
.composer.drag{
  border-color:#10a37f;
  box-shadow:0 0 0 3px rgba(16, 163, 127, 0.3), 0 12px 40px rgba(0, 0, 0, 0.7);
}
.attachments{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:2px 0 4px;
  scrollbar-width:none;
}
.attachments::-webkit-scrollbar{display:none}
.att{
  height:28px;
  max-width:160px;
  border-radius:14px;
  background:rgba(255, 255, 255, 0.08);
  border:1px solid rgba(255, 255, 255, 0.1);
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 8px 0 10px;
  font-size:12px;
  font-weight:500;
  color:#e4e4e7;
  flex-shrink:0;
}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;font-size:10px;display:grid;place-items:center;border:none;cursor:pointer}
textarea{
  width:100%;
  min-height:28px;
  max-height:140px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  padding:4px 0 6px;
  font-size:15.5px;
  line-height:1.45;
  color:#f4f4f5;
  font-family:inherit;
}
textarea::placeholder{
  color:#71717a;
  font-weight:400;
}
.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
}
.round{
  width:32px;
  height:32px;
  border-radius:50%;
  background:rgba(255, 255, 255, 0.08);
  border:1px solid rgba(255, 255, 255, 0.06);
  display:grid;
  place-items:center;
  flex-shrink:0;
  color:#a1a1aa;
  transition:transform .12s, background .15s, color .15s;
  border:none;
  cursor:pointer;
}
.round:active{transform:scale(0.92)}
.round svg{width:17px;height:17px;stroke:currentColor;fill:none}
.round.icon-btn{
  background:transparent;
  border:none;
}
.round.icon-btn:hover,.round.icon-btn:active{
  background:rgba(255, 255, 255, 0.1);
  color:#ffffff;
}
.round.send{
  margin-left:auto;
  background:#ffffff;
  color:#000000;
  border:none;
  box-shadow:0 2px 8px rgba(0, 0, 0, 0.35);
}
.round.send svg{width:16px;height:16px;stroke:#000000;fill:none}
.round.send:disabled{
  opacity:0.3;
  background:rgba(255, 255, 255, 0.12);
  color:#52525b;
  box-shadow:none;
  cursor:default;
}
.round.send:disabled svg{stroke:#52525b}
.round.primary{
  margin-left:auto;
  background:#ffffff;
  color:#000000;
  box-shadow:0 2px 8px rgba(255, 255, 255, 0.3);
  font-size:12px;
  font-weight:bold;
}

.model-chip{
  height:28px;
  border-radius:14px;
  background:rgba(255, 255, 255, 0.06);
  border:1px solid rgba(255, 255, 255, 0.1);
  padding:0 24px 0 10px;
  font-size:12px;
  font-weight:500;
  color:#d4d4d8;
  appearance:none;
  -webkit-appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%23a1a1aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
  background-repeat:no-repeat;
  background-position:right 8px center;
  outline:0;
  max-width:160px;
  text-overflow:ellipsis;
  white-space:nowrap;
  overflow:hidden;
}


/* Pair Screen */
.pair{height:100%;display:grid;place-items:start center;overflow:auto;-webkit-overflow-scrolling:touch;padding:48px 24px 24px;background:var(--bg)}
.pair-card{
  width:min(380px,100%);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:26px 22px;
  box-shadow:0 24px 70px rgba(0,0,0,0.5);
  text-align:center;
}
.pair-logo{
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--panel);
  border:1px solid var(--border);
  display:grid;
  place-items:center;
  margin:0 auto 16px;
  color:#fff;
}
.pair-card h1{margin:0 0 6px;font-size:22px;font-weight:700}
.pair-card p{margin:0 0 18px;font-size:14px;color:var(--text-muted);line-height:1.45}
.scan-qr-btn{
  width:100%;
  height:48px;
  border-radius:var(--radius-md);
  background:#ffffff;
  color:#000000;
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .12s;
}
.scan-qr-btn:active{transform:scale(0.98)}
.pair-divider{
  display:flex;
  align-items:center;
  text-align:center;
  color:var(--text-soft);
  font-size:12px;
  margin:16px 0;
}
.pair-divider::before,.pair-divider::after{content:'';flex:1;border-bottom:1px solid var(--border)}
.pair-divider span{padding:0 10px}
.pair-card input{
  width:100%;
  height:48px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:#090909;
  padding:0 12px;
  outline:0;
  font-size:20px;
  letter-spacing:.12em;
  text-align:center;
  color:#fff;
}
.pair-card input:focus{border-color:var(--border-focus)}
.pair-card button.submit-btn{
  width:100%;
  height:46px;
  border-radius:var(--radius-md);
  background:#262626;
  color:#ffffff;
  font-weight:700;
  margin-top:12px;
}
.pair-card button.submit-btn:active{background:#333}
.pair-card button:disabled{opacity:0.5}
.pair-error{min-height:20px;color:#f87171;margin-top:8px;font-size:13px}

/* Settings & Bottom Sheet Modals */
.settings-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  z-index:99;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0;
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.settings-card{
  width:100%;
  max-width:540px;
  margin:0 auto;
  background:#171717;
  border-top:1px solid var(--border);
  border-radius:24px 24px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -16px 50px rgba(0,0,0,0.6);
  max-height:85vh;
  overflow-y:auto;
}
.settings-handle{
  width:36px;
  height:4px;
  border-radius:2px;
  background:#3a3a3a;
  margin:0 auto 16px;
}
.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.settings-head h2{margin:0;font-size:18px;font-weight:700}
.close-btn{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#262626;
  color:#fff;
  font-size:16px;
  display:grid;
  place-items:center;
}
.settings-group{margin-bottom:14px}
.settings-group label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.settings-select{
  width:100%;
  height:44px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:#0d0d0d;
  padding:0 12px;
  font-weight:600;
  font-size:14px;
}
.settings-val{
  font-size:13.5px;
  color:#e0e0e0;
  background:#0d0d0d;
  padding:10px 12px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
}
.settings-action-btn{
  width:100%;
  height:44px;
  border-radius:var(--radius-md);
  background:#262626;
  color:#fff;
  font-weight:600;
  font-size:14px;
  margin-top:10px;
}
.danger-action-btn{
  width:100%;
  height:44px;
  border-radius:var(--radius-md);
  background:var(--danger-bg);
  color:#fca5a5;
  border:1px solid #7f1d1d;
  font-weight:600;
  font-size:14px;
  margin-top:10px;
}
.diag-box{
  font:11.5px/1.45 var(--code);
  background:#090909;
  border:1px solid #262626;
  border-radius:var(--radius-md);
  padding:10px;
  margin-top:10px;
  max-height:160px;
  overflow:auto;
  color:#a3a3a3;
}

/* Approval Modal & Card */
.approval-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.78);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.approval-dialog{width:100%;display:flex;justify-content:center}
.approval-card{
  width:min(440px,100%);
  background:#18181b;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;
  padding:20px;
  box-shadow:0 24px 60px rgba(0,0,0,0.85);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.approval-card h2{
  font-size:16px;
  font-weight:700;
  color:#f4f4f5;
  margin:0;
  line-height:1.35;
}
.approval-sub{
  font-size:12.5px;
  color:var(--text-muted);
}
.approval-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:6px;
}
.approve-btn{
  height:44px;
  border-radius:var(--radius-md);
  font-size:14px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .12s, background .15s;
  border:none;
}
.approve-btn:active{transform:scale(0.97)}
.approve-btn.primary{
  background:#ffffff;
  color:#000000;
  font-weight:700;
}
.approve-btn.secondary{
  background:#27272a;
  color:#f4f4f5;
  border:1px solid #3f3f46;
}
.approve-btn.reject{
  grid-column:1 / -1;
  background:rgba(239,68,68,0.12);
  color:#f87171;
  border:1px solid rgba(239,68,68,0.25);
}

@media(min-width:768px){
  .app{max-width:540px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .composer{left:calc(50% - 258px);right:calc(50% - 258px)}
}
</style>

</head>
<body>

<!-- Pairing Screen -->
<section id="pairScreen" class="pair hidden">
  <div class="pair-card">
    <div class="pair-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8.8 2h8.4l-4 7h5.7L8 22l2.7-8H5.1z"/></svg>
    </div>
    <h1 data-i18n="pair_title">LocalCode koppeln</h1>
    <p data-i18n="pair_help">Scanne den QR-Code auf deinem Desktop-Bildschirm oder gib den 8-stelligen Code ein.</p>
    <button id="scanQrBtn" type="button" class="scan-qr-btn">
      <span>📷</span> <span data-i18n="scan_qr">QR-Code scannen</span>
    </button>
    <div class="pair-divider"><span data-i18n="or_manual">oder Code manuell eingeben</span></div>
    <form id="pairForm">
      <input id="pairCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="00000000">
      <button id="pairBtn" type="submit" class="submit-btn" data-i18n="pair_button">Verbinden</button>
      <div id="pairError" class="pair-error"></div>
    </form>
  </div>
</section>

<!-- Sidebar Drawer -->
<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-header">
    <div class="drawer-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8.8 2h8.4l-4 7h5.7L8 22l2.7-8H5.1z"/></svg>
      <span>LocalCode</span>
    </div>
    <button id="closeDrawerBtn" class="header-btn" type="button" aria-label="Schließen">✕</button>
  </div>
  <input id="drawerSearch" class="drawer-search" type="text" placeholder="Suche..." data-i18n-placeholder="search_placeholder">
  <div class="drawer-content">
    <button id="newChatDrawerBtn" class="drawer-item" type="button">
      <span class="drawer-item-icon">＋</span>
      <span class="drawer-item-title" data-i18n="new_task">Neue Aufgabe</span>
    </button>
    <div class="drawer-section-title" data-i18n="projects">Projekte</div>
    <div id="drawerProjectsList"></div>
    <div class="drawer-section-title" data-i18n="history">Verlauf</div>
    <div id="drawerHistoryList"></div>
  </div>
  <div class="drawer-footer">
    <button id="drawerTrashBtn" class="drawer-item" type="button">
      <span class="drawer-item-icon">♲</span>
      <span class="drawer-item-title" data-i18n="trash">Papierkorb</span>
    </button>
    <button id="drawerSettingsBtn" class="drawer-item" type="button">
      <span class="drawer-item-icon">⚙</span>
      <span class="drawer-item-title" data-i18n="settings">Einstellungen</span>
    </button>
  </div>
</aside>

<!-- Main App Surface -->
<section id="app" class="app hidden">
  <header class="top">
    <button id="drawerToggleBtn" class="header-btn" type="button" aria-label="Menü">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 10h18v2H3v-2z"/></svg>
    </button>
    <button id="modelProjectPill" class="model-pill-btn" type="button">
      <div id="dot" class="status-dot"></div>
      <span id="modelPillText" class="model-pill-name">qwen2.5-coder:14b</span>
      <span style="font-size:10px;opacity:0.6">▾</span>
    </button>
    <button id="newChatTopBtn" class="header-btn" type="button" aria-label="Neuer Chat">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
    <!-- Hidden element kept for contract compatibility -->
    <div id="subtitle" class="hidden">Remote</div>
    <button id="settingsBtn" class="gear-btn" type="button" title="Einstellungen">⚙️</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="new" data-i18n="new_task">Neue Aufgabe</button>
    <button id="tasksTabBtn" class="tab hidden" data-view="tasks" data-i18n="tasks">Tasks</button>
    <button class="tab" data-view="projects" data-i18n="projects">Projekte</button>
    <button class="tab" data-view="trash" data-i18n="trash">Papierkorb</button>
    <button class="tab" data-view="review" data-i18n="review">Review</button>
  </nav>

  <main class="main">
    <div id="newView" class="view"></div>
    <div id="tasksView" class="view hidden"></div>
    <div id="projectsView" class="view hidden"></div>
    <div id="trashView" class="view hidden"></div>
    <div id="reviewView" class="view hidden"></div>

    <!-- Floating Pill Composer -->
    <form id="composer" class="composer">
      <div id="attachments" class="attachments hidden"></div>
      <textarea id="prompt" data-i18n-placeholder="placeholder" placeholder="Nachricht eingeben..." rows="1"></textarea>
      <div class="toolbar">
        <button id="attachBtn" class="round" type="button" data-i18n-title="upload" aria-label="Dateien anhängen">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <input id="fileInput" class="hidden" type="file" multiple>
        <select id="projectSelect" class="model-chip"></select>
        <div class="spacer" style="flex:1"></div>
        <button id="voiceBtn" class="round" type="button" data-i18n-title="voice" aria-label="Spracheingabe">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
        </button>
        <button id="stopBtn" class="round primary hidden" type="button" aria-label="Stop">■</button>
        <button id="sendBtn" class="round send" type="button" aria-label="Senden">
          <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>


    </form>
    <button id="scrollToBottomBtn" class="scroll-bottom-btn hidden" type="button" aria-label="Nach unten scrollen" data-i18n-title="scroll_to_bottom">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
  </main>

</section>

<section id="approvalModal" class="approval-modal hidden" role="dialog" aria-modal="true">
  <div id="approvalDialog" class="approval-dialog"></div>
</section>

<!-- Settings Bottom Sheet Modal -->
<section id="settingsModal" class="settings-modal hidden">
  <div class="settings-card">
    <div class="settings-handle"></div>
    <div class="settings-head">
      <h2 data-i18n="settings">Einstellungen</h2>
      <button id="closeSettingsBtn" class="close-btn" type="button">×</button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <label data-i18n="engine_label">Coding-Engine</label>
        <select id="engineSelect" class="settings-select">
          <option value="native">LocalCode Native</option>
          <option value="aider">Aider</option>
          <option value="opencode">OpenCode</option>
          <option value="claude">Claude Code</option>
          <option value="claw">Claw Code</option>
        </select>
      </div>
      <div class="settings-group">
        <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;width:100%;">
          <span data-i18n="show_tasks_tab">Tasks-Reiter anzeigen</span>
          <input type="checkbox" id="showTasksTabToggle" style="width:18px;height:18px;accent-color:#38bdf8;cursor:pointer;">
        </label>
      </div>
      <div class="settings-group">
        <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;width:100%;">
          <span data-i18n="voice_output_label">Sprachausgabe (TTS)</span>
          <input type="checkbox" id="ttsToggle" style="width:18px;height:18px;accent-color:#38bdf8;cursor:pointer;">
        </label>
      </div>
      <div class="settings-group">
        <label data-i18n="active_model">Aktives Modell</label>

        <div id="settingsModel" class="settings-val muted">qwen2.5-coder:14b</div>
      </div>
      <div class="settings-group">
        <label data-i18n="server_url">Host-Adresse</label>
        <div id="settingsHost" class="settings-val muted">LocalCode LAN</div>
      </div>
      <button id="diagBtn" type="button" class="settings-action-btn" data-i18n="run_diag">Systemdiagnose prüfen</button>
      <div id="diagResult" class="diag-box hidden"></div>
      <button id="disconnectBtn" type="button" class="danger-action-btn" data-i18n="disconnect">Verbindung trennen</button>
    </div>
  </div>
</section>

function speakText(rawText){
  if(!rawText)return;
  let clean=String(rawText)
    .replace(/```[\s\S]*?```/g,' Codeblock ')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/[*_#~>]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
  if(!clean)return;
  if(window.LocalCodeAndroid?.speak){
    window.LocalCodeAndroid.speak(clean);
  }else if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean);
    u.lang=lang==='de'?'de-DE':'en-US';
    window.speechSynthesis.speak(u);
  }
}
window.speakText=speakText;

function stopSpeech(){
  if(window.LocalCodeAndroid?.stopSpeaking){
    window.LocalCodeAndroid.stopSpeaking();
  }else if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }
}

function copyCode(btn){
  const block=btn.closest('.code, .diff-box');
  if(!block)return;
  const target=block.querySelector('code')||block;
  navigator.clipboard.writeText(target.innerText).then(()=>{
    const old=btn.textContent;
    btn.textContent=t('copied');
    setTimeout(()=>btn.textContent=old,1500);
  }).catch(()=>{});
}


function formatDiff(raw){
  if(!raw)return '';
  const lines=String(raw).split('\n');
  const isDiff=lines.some(l=>l.startsWith('--- ')||l.startsWith('+++ ')||l.startsWith('@@ ')||(l.startsWith('+')&&!l.startsWith('+++'))||(l.startsWith('-')&&!l.startsWith('---')));
  if(!isDiff){
    return `<div class="code"><div class="code-header"><span>Output</span><button class="copy-code-btn" type="button" onclick="copyCode(this)">${t('copy')}</button></div><pre><code>${esc(raw)}</code></pre></div>`;
  }
  let html=`<div class="diff-box"><div class="code-header" style="margin:0 10px 6px;padding-top:4px;"><span>Diff</span><button class="copy-code-btn" type="button" onclick="copyCode(this)">${t('copy')}</button></div>`;
  for(const line of lines){
    if(line.startsWith('---')||line.startsWith('+++')){
      html+=`<div class="diff-line diff-meta"><span class="diff-sign">·</span><span class="diff-text">${esc(line)}</span></div>`;
    }else if(line.startsWith('@@')){
      html+=`<div class="diff-line diff-hunk"><span class="diff-sign">↕</span><span class="diff-text">${esc(line)}</span></div>`;
    }else if(line.startsWith('+')){
      html+=`<div class="diff-line diff-add"><span class="diff-sign">+</span><span class="diff-text">${esc(line.slice(1))}</span></div>`;
    }else if(line.startsWith('-')){
      html+=`<div class="diff-line diff-del"><span class="diff-sign">-</span><span class="diff-text">${esc(line.slice(1))}</span></div>`;
    }else{
      const text=line.startsWith(' ')?line.slice(1):line;
      html+=`<div class="diff-line diff-ctx"><span class="diff-sign"> </span><span class="diff-text">${esc(text)}</span></div>`;
    }
  }
  html+='</div>';
  return html;
}

function renderMarkdown(raw){
  if(!raw)return '';
  let str=String(raw);
  str=str.replace(/```([a-zA-Z0-9_\-]*)\n([\s\S]*?)```/g,(_,lang,code)=>`___CODEBLOCK_${encodeURIComponent(JSON.stringify({lang:lang||'Code',code}))}___`);
  str=str.replace(/`([^`\n]+)`/g,(_,c)=>`<code class="inline-code">${esc(c)}</code>`);
  str=str.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  str=str.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  str=str.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  str=str.replace(/\n/g,'<br>');
  str=str.replace(/___CODEBLOCK_([^ ]+)___/g,(_,payload)=>{
    try{
      const data=JSON.parse(decodeURIComponent(payload));
      return `<div class="code"><div class="code-header"><span>${esc(data.lang)}</span><button class="copy-code-btn" type="button" onclick="copyCode(this)">${t('copy')}</button></div><pre><code>${esc(data.code)}</code></pre></div>`;
    }catch(e){return ''}
  });
  return str;
}

async function deleteSelectedProject(){if(state.status?.running)return;const path=state.project||$('#projectSelect').value;if(!path){window.alert(t('nothing_selected'));return}try{const preview=await api('/remote/api/project-delete-preview?path='+encodeURIComponent(path));if(preview.empty){if(!window.confirm(t('delete_empty')))return;await api('/remote/api/project-action',{method:'POST',body:JSON.stringify({path,action:'delete_empty',value:''})})}else{const message=t('delete_full',{files:preview.files,dirs:preview.directories,bytes:preview.bytes})+' '+(preview.confirmation||'');const typed=window.prompt(message,'');if(typed===null)return;if(typed.trim()!==String(preview.confirmation)){window.alert(t('delete_mismatch'));return}await api('/remote/api/project-action',{method:'POST',body:JSON.stringify({path,action:'delete_recursive',value:typed.trim()})});window.alert(t('quarantine_done'))}state.project='';state.currentThread='';await refresh();showView('projects')}catch(e){window.alert(e.message)}}
function playStoreTask(){if(lang==='de')return `Erstelle für das ausgewählte Android-Projekt einen vollständigen lokalen Play-Store-Release-Build. Prüfe zuerst Projektstruktur, Gradle/SDK, applicationId/package, versionCode/versionName, Manifest, min/target SDK und die vorhandene Signing-Konfiguration. Verändere oder ersetze niemals Keystore, Upload-Key oder Zertifikat und gib niemals Passwörter, Tokens oder andere Secrets aus. Führe vorhandene Tests und Lint-Prüfungen aus. Erzeuge anschließend, sofern vom Projekt unterstützt, bundleRelease (.aab) und assembleRelease (.apk), verifiziere die Artefakte und nenne die exakten Pfade, Größen und SHA-256. Nutze vorhandene Gradle-Wrapper und keine globale Installation, wenn sie nicht ausdrücklich nötig und genehmigt ist. Wenn Signing, SDK, Gradle oder Store-Metadaten fehlen, behebe nur sichere lokale Konfiguration; geheime, destruktive, externe oder publizierende Schritte brauchen eine eigene Freigabe. Niemals automatisch zum Play Store hochladen, einen Release-Track verändern oder veröffentlichen.`;return `Create a complete local Play Store release build for the selected Android project. First inspect the project structure, Gradle/SDK, applicationId/package, versionCode/versionName, manifest, min/target SDK and existing signing configuration. Never create, replace or rotate a keystore, upload key or certificate, and never expose passwords, tokens or other secrets. Run existing tests and lint checks. Then, where supported, build bundleRelease (.aab) and assembleRelease (.apk), verify the artifacts and report exact paths, sizes and SHA-256 hashes. Use the project's Gradle wrapper and avoid global installs unless explicitly necessary and approved. If signing, SDK, Gradle or store metadata is missing, change only safe local configuration; secret, destructive, external or publishing steps require a separate approval. Never upload to Google Play, alter a release track or publish automatically.`}
async function playStoreBuild(){if(state.status?.running)return;const path=state.project||$('#projectSelect').value;if(!path){window.alert(t('nothing_selected'));return}if(!window.confirm(t('store_confirm')))return;try{const r=await api('/remote/api/new-chat',{method:'POST',body:JSON.stringify({project:path})});const thread=r.thread?.id||'';state.currentThread=thread;state.project=path;await api('/remote/api/chat',{method:'POST',body:JSON.stringify({message:playStoreTask(),project:path,thread_id:thread,model:state.status?.model||'',attachments:[]})});await refresh();showView('review')}catch(e){window.alert(e.message)}}
function renderTrash(){const host=$('#trashView');if(!state.quarantine.length){host.innerHTML=`<div class="empty"><div class="empty-logo">♲</div><h1>${t('trash')}</h1><p>${t('trash_empty')}</p></div>`;return}host.innerHTML=`<div class="section-title">${t('trash')}</div>`+state.quarantine.map(entry=>`<div class="trash-card"><div class="row-title">${esc(entry.name)}</div><div class="row-sub">${esc(t('trash_meta',{files:entry.files,dirs:entry.directories,bytes:entry.bytes}))}</div><div class="trash-actions"><button data-restore="${esc(entry.id)}">${t('restore')}</button><button class="purge" data-purge="${esc(entry.id)}" data-name="${esc(entry.name)}">${t('purge')}</button></div></div>`).join('');host.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreTrashProject(b.dataset.restore));host.querySelectorAll('[data-purge]').forEach(b=>b.onclick=()=>purgeTrashProject(b.dataset.purge,b.dataset.name))}
async function restoreTrashProject(id){if(state.status?.running)return;try{await api('/remote/api/project-quarantine-action',{method:'POST',body:JSON.stringify({action:'restore',id})});await refresh();window.alert(t('restore_done'));showView('trash')}catch(e){window.alert(e.message)}}
async function purgeTrashProject(id,name){if(state.status?.running)return;const expected='PURGE '+name;const typed=window.prompt(t('purge_prompt',{project:name})+' '+expected,'');if(typed===null)return;if(typed!==expected){window.alert(t('delete_mismatch'));return}try{await api('/remote/api/project-quarantine-action',{method:'POST',body:JSON.stringify({action:'purge',id,confirmation:typed})});await refresh();window.alert(t('purge_done'));showView('trash')}catch(e){window.alert(e.message)}}
function isTransientRunEvent(ev){return ['progress','action_running'].includes(ev.type)||ev.type==='status'}
function renderEvents(){const host=$('#reviewView'),running=!!state.status?.running;const visible=state.events.filter(ev=>running||!isTransientRunEvent(ev));if(!visible.length){host.innerHTML=`<div class="empty"><div class="empty-logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.8 2h8.4l-4 7h5.7L8 22l2.7-8H5.1z"/></svg></div><h1>LocalCode</h1><p>${t('no_events')}</p></div>`;return}host.innerHTML=visible.map(eventHTML).join('');host.scrollTop=host.scrollHeight}
function eventHTML(ev){
  const user=ev.type==='user',isFinal=ev.type==='final',isErr=ev.type==='error'||ev.type==='tool_error',isWarn=ev.type==='warning',isTool=['tool_result','action_done','action_running','agent_step','progress'].includes(ev.type);
  let detail=ev.detail?formatDiff(ev.detail):'';
  if(ev.preview)detail+=formatDiff(ev.preview);
  const meta=[ev.action,ev.path,ev.command].filter(Boolean).map(x=>`<span class="event-chip">${esc(x)}</span>`).join('');
  if(isTool){
    return`<details class="bubble-row agent tool-step"><summary class="event-summary"><span class="tool-chevron">›</span> <b>${esc(ev.action||ev.type||'Aktion')}</b>: ${esc(ev.message||'')}</summary>${detail}${meta?`<div class="event-meta">${meta}</div>`:''}</details>`;
  }
  const body=user?esc(ev.message||ev.type||''):renderMarkdown(ev.message||ev.type||'');
  const speakBtn=isFinal&&ev.message?`<div style="display:flex;justify-content:flex-end;margin-top:8px;"><button class="copy-code-btn" type="button" onclick="speakText(decodeURIComponent('${encodeURIComponent(ev.message)}'));event.stopPropagation();">🔊 ${t('speak_aloud')}</button></div>`:'';
  return`<div class="bubble-row ${user?'user':'agent'}${isFinal?' final-result':''}${isErr?' error':''}${isWarn?' warning':''}"><div class="bubble"><div>${body}</div>${speakBtn}${detail}${meta?`<div class="event-meta">${meta}</div>`:''}</div></div>`;
}

function renderApproval(){
  const modal=$('#approvalModal'),host=$('#approvalDialog'),p=state.pending;
  if(!p){modal.classList.add('hidden');host.innerHTML='';return}
  host.innerHTML=`<div class="approval-card"><h2>${esc(p.message||p.action||t('approve'))}</h2><div class="approval-sub">${esc([p.action,p.path,p.command].filter(Boolean).join(' · '))}</div>${p.preview?formatDiff(p.preview):''}<div class="approval-actions"><button class="approve-btn primary" data-decision="once">${t('approve_once')}</button><button class="approve-btn secondary" data-decision="project">${t('approve_project')}</button><button class="approve-btn reject" data-decision="reject">${t('reject')}</button></div></div>`;
  modal.classList.remove('hidden');
  host.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>approve(b.dataset.decision));
}


function renderNew(){
  $('#newView').innerHTML=`
    <div class="new-hero">
      <div class="empty-logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.8 2h8.4l-4 7h5.7L8 22l2.7-8H5.1z"/></svg></div>
      <h1>LocalCode</h1>
      <p>${t('new_chat')}</p>
    </div>
    <div class="starter-grid">
      <button class="starter-card" type="button" data-prompt="Analysiere die Architektur, Dateien und Entrypoints dieses Projekts.">
        <div class="starter-icon">🔍</div>
        <div class="starter-title">${t('starter_analyze_title')}</div>
        <div class="starter-desc">${t('starter_analyze_desc')}</div>
      </button>
      <button class="starter-card" type="button" data-prompt="Führe alle vorhandenen Tests und Linter aus und berichte Fehler oder Warnungen.">
        <div class="starter-icon">🧪</div>
        <div class="starter-title">${t('starter_test_title')}</div>
        <div class="starter-desc">${t('starter_test_desc')}</div>
      </button>
      <button class="starter-card" type="button" data-prompt="Prüfe den Git-Status, ungesicherte Änderungen und offene Commits.">
        <div class="starter-icon">🌿</div>
        <div class="starter-title">${t('starter_git_title')}</div>
        <div class="starter-desc">${t('starter_git_desc')}</div>
      </button>
      <button class="starter-card" type="button" data-action="store">
        <div class="starter-icon">📦</div>
        <div class="starter-title">${t('starter_build_title')}</div>
        <div class="starter-desc">${t('starter_build_desc')}</div>
      </button>
    </div>
  `;
  $('#newView').querySelectorAll('.starter-card[data-prompt]').forEach(b=>b.onclick=()=>{
    haptic(15);
    $('#prompt').value=b.dataset.prompt;
    $('#prompt').focus();
    updateSendState();
  });
  $('#newView').querySelectorAll('.starter-card[data-action="store"]').forEach(b=>b.onclick=()=>{
    haptic(15);
    playStoreBuild();

function renderFiles(){const box=$('#attachments');box.classList.toggle('hidden',!state.files.length);box.innerHTML=state.files.map((f,i)=>`<div class="att"><span>${esc(f.name)}</span><button type="button" data-remove="${i}">×</button></div>`).join('');box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.files.splice(Number(b.dataset.remove),1);renderFiles()});updateSendState()}
async function approve(decision){if(!state.pending)return;await api('/remote/api/approve',{method:'POST',body:JSON.stringify({id:state.pending.id,decision,approve:decision!=='reject'})});state.pending=null;renderApproval();await refresh()}
function readFile(file){return new Promise((res,rej)=>{if(file.size>MAX_FILE_BYTES)return rej(new Error(t('file_too_large',{name:file.name})));const fr=new FileReader();fr.onerror=()=>rej(fr.error);fr.onload=()=>{const v=String(fr.result||''),i=v.indexOf(',');res({name:file.name,mime:file.type||'application/octet-stream',size:file.size,data:i>=0?v.slice(i+1):v})};fr.readAsDataURL(file)})}
async function addFiles(files){const list=[...files].filter(Boolean);if(!list.length)return;let total=state.files.reduce((n,f)=>n+f.size,0),room=MAX_FILES-state.files.length;if(room<=0)return window.alert(t('max_files',{count:MAX_FILES}));try{for(const f of list.slice(0,room)){if(total+f.size>MAX_TOTAL_BYTES)throw new Error(t('total_too_large'));const item=await readFile(f);state.files.push(item);total+=item.size}renderFiles();$('#prompt').focus()}catch(e){window.alert(e.message)}}
function appendPromptText(text){text=String(text||'').trim();if(!text)return;const prompt=$('#prompt'),prefix=prompt.value.trim()?' ':'';prompt.value+=prefix+text;prompt.focus();updateSendState()}
window.localCodeVoiceResult=text=>{appendPromptText(text);if(text&&text.trim()){setTimeout(()=>send(),150)}};
function startVoiceInput(){if(window.LocalCodeAndroid?.startVoiceInput){window.LocalCodeAndroid.startVoiceInput();return}const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)return window.alert(t('voice_unavailable'));try{const rec=new Speech();rec.lang=navigator.language||lang;rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{const txt=e.results?.[0]?.[0]?.transcript||'';appendPromptText(txt);if(txt.trim()){setTimeout(()=>send(),150)}};rec.onerror=e=>window.alert(t('voice_failed')+' '+(e.error||''));rec.start()}catch(e){window.alert(t('voice_failed')+' '+e.message)}}
function triggerQrScan(){if(window.LocalCodeAndroid?.startQrScan){window.LocalCodeAndroid.startQrScan();return}window.alert(t('pair_help'))}
async function send(ev){ev?.preventDefault();if(state.sending)return;const msg=$('#prompt').value.trim();if(!msg&&!state.files.length)return;const project=$('#projectSelect').value||state.project||state.projects[0]?.path||'';if(!project){window.alert(t('nothing_selected'));return}state.project=project;const attachments=state.files.map(({name,mime,size,data})=>({name,mime,size,data}));try{state.sending=true;updateSendState();haptic(20);if(!state.currentThread){const r=await api('/remote/api/new-chat',{method:'POST',body:JSON.stringify({project})});state.currentThread=r.thread?.id||''}await api('/remote/api/chat',{method:'POST',body:JSON.stringify({message:msg,project,thread_id:state.currentThread,model:state.status?.model||'',attachments})});$('#prompt').value='';state.files=[];renderFiles();await refresh();showView('review')}catch(e){window.alert(e.message)}finally{state.sending=false;updateSendState()}}

function effectiveViewOrder(){return state.showTasksTab?viewOrder:viewOrder.filter(v=>v!=='tasks')}
function showView(name){if(!state.showTasksTab&&name==='tasks')name='new';state.view=name;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));for(const v of viewOrder)$('#'+v+'View').classList.toggle('hidden',v!==name);render()}
function swipeView(step){const list=effectiveViewOrder(),i=list.indexOf(state.view),next=list[Math.max(0,Math.min(list.length-1,i+step))];if(next&&next!==state.view)showView(next)}
function bindSwipe(){const area=$('.main');let sx=0,sy=0,active=false;area.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const tag=(e.target?.tagName||'').toUpperCase();if(['BUTTON','INPUT','TEXTAREA','SELECT','OPTION'].includes(tag))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;active=true},{passive:true});area.addEventListener('touchend',e=>{if(!active||!e.changedTouches.length)return;active=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.25)return;swipeView(dx<0?1:-1)},{passive:true});area.addEventListener('touchcancel',()=>{active=false},{passive:true})}
async function connectEvents(){if(state.es)state.es.close();if(!state.token)return;try{const stream=await api('/remote/api/event-ticket',{method:'POST'});const es=new EventSource('/remote/api/events?ticket='+encodeURIComponent(stream.ticket));state.es=es;es.onmessage=e=>{const ev=JSON.parse(e.data);if(ev.thread_id&&state.currentThread&&ev.thread_id!==state.currentThread)return;state.events.push(ev);if(ev.type==='approval_required')state.pending=ev;if(ev.type==='approval_required')haptic(50);if(ev.type==='approval')state.pending=null;if(ev.type==='final'){haptic(40);if(state.ttsEnabled&&ev.message)speakText(ev.message)}if(ev.type==='status')refresh();render()};es.onerror=()=>{es.close();if(state.es===es)setTimeout(connectEvents,1800)}}catch(e){console.warn(e);setTimeout(connectEvents,1800)}}



// Drawer Management
function openDrawer(){$('#drawer').classList.add('open');$('#drawerBackdrop').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawerBackdrop').classList.remove('open')}
$('#drawerToggleBtn').onclick=openDrawer;
$('#closeDrawerBtn').onclick=closeDrawer;
$('#drawerBackdrop').onclick=closeDrawer;
$('#drawerSearch').oninput=renderDrawer;
$('#newChatTopBtn').onclick=()=>{showView('new');$('#prompt').focus()};
$('#newChatDrawerBtn').onclick=()=>{closeDrawer();showView('new');$('#prompt').focus()};
$('#drawerTrashBtn').onclick=()=>{closeDrawer();showView('trash')};
$('#drawerSettingsBtn').onclick=()=>{closeDrawer();updateSettingsView();$('#settingsModal').classList.remove('hidden')};
$('#modelProjectPill').onclick=()=>{updateSettingsView();$('#settingsModal').classList.remove('hidden')};

// Scroll To Bottom Listener
const reviewView=$('#reviewView');
const scrollBtn=$('#scrollToBottomBtn');
if(reviewView&&scrollBtn){
  reviewView.addEventListener('scroll',()=>{
    const fromBottom=reviewView.scrollHeight-reviewView.scrollTop-reviewView.clientHeight;
    scrollBtn.classList.toggle('hidden',fromBottom<120);
  },{passive:true});
  scrollBtn.onclick=()=>{
    haptic(10);
    reviewView.scrollTo({top:reviewView.scrollHeight,behavior:'smooth'});
  };
}

// Event Handlers

$('#scanQrBtn').onclick=triggerQrScan;
$('#pairForm').onsubmit=pair;
$$('.tab').forEach(b=>b.onclick=()=>showView(b.dataset.view));
bindSwipe();
$('#attachBtn').onclick=()=>$('#fileInput').click();
$('#voiceBtn').onclick=startVoiceInput;
$('#fileInput').onchange=async e=>{await addFiles(e.target.files||[]);e.target.value=''};
const composer=$('#composer');composer.onsubmit=send;
composer.ondragover=e=>{if(e.dataTransfer?.files?.length){e.preventDefault();composer.classList.add('drag')}};
composer.ondragleave=()=>composer.classList.remove('drag');
composer.ondrop=e=>{composer.classList.remove('drag');if(e.dataTransfer?.files?.length){e.preventDefault();addFiles(e.dataTransfer.files)}};
$('#stopBtn').onclick=async()=>{await api('/remote/api/stop',{method:'POST'});await refresh()};
$('#sendBtn').onclick=send;
$('#prompt').oninput=()=>{
  const p=$('#prompt');
  p.style.height='auto';
  p.style.height=Math.min(140,Math.max(38,p.scrollHeight))+'px';
  updateSendState();
};
$('#projectSelect').onchange=e=>{
  const newProj=e.target.value;
  if(!newProj||newProj===state.project)return;
  if(state.project){
    const name=projectName(newProj);
    if(!window.confirm(t('switch_project_confirm',{project:name}))){
      renderProjectSelect();
      return;
    }
  }
  state.project=newProj;
  render();
};


// Settings Modal Handlers
$('#settingsBtn').onclick=()=>{updateSettingsView();$('#settingsModal').classList.remove('hidden')};
$('#closeSettingsBtn').onclick=()=>$('#settingsModal').classList.add('hidden');
$('#settingsModal').onclick=e=>{if(e.target===$('#settingsModal'))$('#settingsModal').classList.add('hidden')};
$('#engineSelect').onchange=e=>selectEditingEngine(e.target.value);
$('#showTasksTabToggle').onchange=e=>{
  state.showTasksTab=e.target.checked;
  localStorage.setItem('localcodeRemoteShowTasksTab',state.showTasksTab?'true':'false');
  if(!state.showTasksTab&&state.view==='tasks')showView('new');
  render();
};
const ttsInput=$('#ttsToggle');
if(ttsInput){
  ttsInput.onchange=e=>{
    state.ttsEnabled=e.target.checked;
    localStorage.setItem('localcodeRemoteTTS',state.ttsEnabled?'true':'false');
    if(!state.ttsEnabled)stopSpeech();
  };
}

$('#disconnectBtn').onclick=()=>{
  if(!window.confirm(t('disconnect_confirm')))return;
  state.token='';
  localStorage.removeItem('localcodeRemoteToken');
  $('#settingsModal').classList.add('hidden');
  showPair();
};
$('#diagBtn').onclick=async()=>{
  const box=$('#diagResult');box.classList.remove('hidden');box.textContent='Prüfe Systemdiagnose...';
  try{
    const d=window.LocalCodeAndroid?.runDiagnostics?JSON.parse(window.LocalCodeAndroid.runDiagnostics()):{};
    const st=await api('/remote/api/status');
    box.textContent=JSON.stringify({remote_status:st,android_diagnostics:d},null,2);
  }catch(e){box.textContent='Fehler: '+e.message}
};

window.LocalCodeRemoteControl={
  showView:v=>{showView(v);return true},
  setShowTasksTab:enable=>{state.showTasksTab=!!enable;localStorage.setItem('localcodeRemoteShowTasksTab',state.showTasksTab?'true':'false');if(!state.showTasksTab&&state.view==='tasks')showView('new');render();return true},
  selectProject:p=>{state.project=p;render();return true},
  selectThread:async id=>{await selectThread(id);return true},
  createProject:async name=>{if(state.status?.running)return null;const r=await api('/remote/api/project-action',{method:'POST',body:JSON.stringify({path:state.projectsRoot,action:'create_project',value:name})});state.project=r.project?.path||'';await refresh();return r},
  startTask:async(project,message,engine)=>{const r=await api('/remote/api/new-chat',{method:'POST',body:JSON.stringify({project})});const th=r.thread?.id||'';state.currentThread=th;state.project=project;if(engine)await selectEditingEngine(engine);await api('/remote/api/chat',{method:'POST',body:JSON.stringify({message,project,thread_id:th,model:state.status?.model||'',attachments:[]})});await refresh();showView('review');return{ok:true,thread:th}},
  sendPrompt:async text=>{$('#prompt').value=text;await send();return true},
  stopTask:async()=>{await api('/remote/api/stop',{method:'POST'});await refresh();return true},
  approve:async d=>{if(state.pending){await approve(d||'once');return true}return false},
  selectEngine:async e=>{await selectEditingEngine(e);return state.status?.editing_engine},
  openSettings:()=>{updateSettingsView();$('#settingsModal').classList.remove('hidden');return true},
  closeSettings:()=>{$('#settingsModal').classList.add('hidden');return true},
  injectVoice:text=>{appendPromptText(text);return true},
  triggerQrScan:()=>{triggerQrScan();return true},
  getState:()=>({token:!!state.token,view:state.view,status:state.status,projects:state.projects.length,threads:state.threads.length,currentThread:state.currentThread,currentProject:state.project,events:state.events.length,pending:!!state.pending,showTasksTab:!!state.showTasksTab}),
  runSelfTest:async()=>{const res=[];try{const st=await api('/remote/api/status');res.push({check:'status',ok:!!st.version});const pr=await api('/remote/api/projects');res.push({check:'projects',ok:Array.isArray(pr.projects)});const th=await api('/remote/api/threads');res.push({check:'threads',ok:Array.isArray(th.threads)});const sn=await api('/remote/api/snapshot');res.push({check:'snapshot',ok:Array.isArray(sn.events)});const tk=await api('/remote/api/event-ticket',{method:'POST'});res.push({check:'event_ticket',ok:!!tk.ticket});return{ok:res.every(r=>r.ok),results:res}}catch(e){return{ok:false,error:e.message,results:res}}}
};

const urlParams=new URLSearchParams(window.location.search);
const hashParams=new URLSearchParams(window.location.hash.replace(/^#/,''));
const qrCode=(urlParams.get('code')||hashParams.get('code')||'').trim();
if(qrCode){
  $('#pairCode').value=qrCode;
  showPair();
  pair();
}else if(state.token){
  showApp();
  refresh().then(connectEvents);
}else{
  showPair();
}
setInterval(refresh,5000);
})();
</script>
