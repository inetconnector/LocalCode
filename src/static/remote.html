<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>LocalCode Remote</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d0d0d;
  --surface:#171717;
  --panel:#212121;
  --card:#2f2f2f;
  --card-hover:#383838;
  --border:rgba(255,255,255,0.08);
  --border-focus:rgba(255,255,255,0.25);
  --text:#f5f5f5;
  --text-muted:#8e8e8e;
  --text-soft:#666666;
  --accent:#ffffff;
  --accent-invert:#000000;
  --openai-teal:#10a37f;
  --danger:#ef4444;
  --danger-bg:#3d1a1c;
  --ok:#22c55e;
  --warn:#f59e0b;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --code:"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  --radius-pill:9999px;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.5 var(--font);touch-action:manipulation}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
.hidden{display:none!important}

/* Main App Layout */
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg);position:relative;overflow:hidden}

/* OpenAI-Style Header */
.top{
  height:calc(56px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 12px 0;
  background:rgba(13,13,13,0.85);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  z-index:20;
}
.header-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--text);
  transition:background .15s;
}
.header-btn:active{background:var(--panel)}
.header-btn svg{width:22px;height:22px;fill:currentColor}

/* Model / Project Pill in Header */
.model-pill-btn{
  height:36px;
  padding:0 14px;
  border-radius:var(--radius-pill);
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:600;
  font-size:14px;
  color:var(--text);
  max-width:200px;
}
.model-pill-btn:active{background:var(--panel)}
.model-pill-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-soft);flex-shrink:0}
.status-dot.on{background:var(--ok)}
.status-dot.warn{background:var(--warn)}
.gear-btn{display:none} /* Backward compatibility ref */

/* Navigation Tabs Bar (Desktop/Swipeable) */
.tabs{
  height:40px;
  background:var(--surface);
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 12px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  height:28px;
  border-radius:var(--radius-pill);
  background:transparent;
  color:var(--text-muted);
  font-size:13px;
  font-weight:600;
  padding:0 12px;
  white-space:nowrap;
  transition:all .15s;
}
.tab.active{background:var(--panel);color:var(--text)}

/* Sidebar Drawer (ChatGPT-Style) */
.drawer-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  z-index:90;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(320px,85vw);
  background:#171717;
  border-right:1px solid var(--border);
  z-index:100;
  transform:translateX(-100%);
  transition:transform .28s cubic-bezier(0.16,1,0.3,1);
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
.drawer.open{transform:translateX(0)}
.drawer-header{
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.drawer-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.drawer-search{
  margin:12px 14px 6px;
  height:40px;
  background:#212121;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:0 12px;
  font-size:14px;
  color:var(--text);
  outline:none;
}
.drawer-search:focus{border-color:var(--border-focus)}
.drawer-content{
  flex:1;
  overflow-y:auto;
  padding:8px 12px;
  scrollbar-width:none;
}
.drawer-content::-webkit-scrollbar{display:none}
.drawer-section-title{
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:16px 8px 6px;
}
.drawer-item{
  width:100%;
  min-height:42px;
  padding:8px 10px;
  border-radius:var(--radius-md);
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  font-size:14px;
  color:var(--text);
  transition:background .12s;
}
.drawer-item:active,.drawer-item.active{background:#262626}
.drawer-item-icon{font-size:16px;width:24px;text-align:center;color:var(--text-muted);flex-shrink:0}
.drawer-item-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.drawer-item-meta{font-size:12px;color:var(--text-muted)}
.drawer-footer{
  padding:12px 14px;
  border-top:1px solid var(--border);
  background:#141414;
}

/* Chat & Views Container */
.main{min-height:0;overflow:hidden;position:relative;height:100%}
.view{
  height:100%;
  overflow-y:auto;
  padding:16px 14px 160px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.view::-webkit-scrollbar{display:none}

/* Empty State */
.empty{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  color:var(--text-muted);
}
.empty-logo{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  display:grid;
  place-items:center;
  margin-bottom:14px;
  color:var(--text);
}
.empty h1{margin:0 0 6px;color:#fff;font-size:24px;font-weight:700}
.empty p{margin:0;font-size:15px;line-height:1.5;max-width:280px}

/* Chat Bubbles (OpenAI Style) */
.bubble-row{display:flex;margin:16px 0;gap:10px}
.bubble-row.user{justify-content:flex-end}
.bubble{max-width:86%;word-break:break-word;line-height:1.55}
.bubble-row.user .bubble{
  background:var(--card);
  color:#ffffff;
  border-radius:20px;
  padding:11px 16px;
  font-size:16px;
}
.bubble-row.agent .bubble{
  font-size:16px;
  color:#f0f0f0;
  width:100%;
  max-width:100%;
}
.code{
  margin:10px 0;
  background:#000000;
  border:1px solid #2a2a2a;
  border-radius:var(--radius-md);
  padding:12px;
  font:13px/1.45 var(--code);
  color:#e0e0e0;
  overflow-x:auto;
  white-space:pre;
  position:relative;
}
.code-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  padding-bottom:6px;
  border-bottom:1px solid #222;
  font-size:12px;
  color:var(--text-muted);
}
.copy-code-btn{
  font-size:11px;
  padding:2px 8px;
  border-radius:4px;
  background:#262626;
  color:#fff;
}
.event-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.event-chip{
  display:inline-flex;
  border-radius:var(--radius-sm);
  background:var(--panel);
  padding:3px 8px;
  color:var(--text-muted);
  font-size:12px;
  border:1px solid var(--border);
}

/* Tool Accordion Step */
.tool-step{
  background:#141414;
  border:1px solid #242424;
  border-radius:var(--radius-md);
  padding:8px 12px;
  margin:8px 0;
  font-size:13.5px;
}
.event-summary{
  cursor:pointer;
  color:var(--text-muted);
  list-style:none;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:500;
}
.tool-chevron{display:inline-block;transition:transform .2s;font-size:12px}
.tool-step[open] .event-summary{color:var(--text);margin-bottom:8px}
.tool-step[open] .tool-chevron{transform:rotate(90deg)}
.final-result .bubble{
  border-left:3px solid var(--ok);
  background:rgba(34,197,94,0.06);
  padding:10px 14px;
  border-radius:var(--radius-md);
}

/* In-Stream Approval Card */
.approval-card{
  background:#1f190e;
  border:1px solid #5a4216;
  border-radius:var(--radius-lg);
  padding:16px;
  margin:14px 0;
}
.approval-card h2{font-size:16px;margin:0 0 6px;color:#fef08a}
.approval-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.approval-actions button{height:42px;border-radius:var(--radius-md);font-weight:700;font-size:14px}
.approve{background:#ffffff;color:#000000}
.always{background:#2563eb;color:#ffffff}
.reject{background:var(--danger-bg);color:#fca5a5;border:1px solid #7f1d1d!important}

/* Project & Management Cards */
.action-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px;
  margin:12px 0;
}
.action-card h2{font-size:17px;margin:0 0 4px}
.action-card p{font-size:13px;color:var(--text-muted);margin:0 0 12px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action-grid button{
  min-height:44px;
  border-radius:var(--radius-md);
  font-weight:600;
  font-size:13.5px;
  padding:8px;
  background:var(--panel);
}
.action-grid .primary{background:var(--accent);color:var(--accent-invert)}
.action-grid .danger{background:var(--danger-bg);color:#fca5a5;border:1px solid #7f1d1d}
.action-grid .store{grid-column:1/-1;background:#1e3a8a;color:#ffffff}
.action-grid .trash{grid-column:1/-1;background:#262626;color:var(--text)}
.selected-project{
  font:12px/1.4 var(--code);
  word-break:break-all;
  color:#d4d4d4;
  background:#090909;
  border-radius:var(--radius-sm);
  padding:8px 10px;
  margin-top:10px;
  border:1px solid var(--border);
}
.row{
  border:0;
  background:transparent;
  width:100%;
  min-height:54px;
  padding:8px 6px;
  display:flex;
  gap:12px;
  align-items:center;
  text-align:left;
  border-bottom:1px solid var(--border);
  border-radius:var(--radius-md);
}
.row:active{background:var(--surface)}
.row-icon{
  width:36px;
  height:36px;
  border-radius:var(--radius-md);
  background:var(--panel);
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:13px;
  color:var(--text-muted);
  flex-shrink:0;
}
.row-main{min-width:0;flex:1}
.row-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:12px;color:var(--text-soft)}

/* Trash Cards */
.trash-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:14px;
  margin:10px 0;
}
.trash-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.trash-actions button{min-height:40px;border-radius:var(--radius-md);background:var(--panel);font-weight:600}
.trash-actions .purge{background:var(--danger-bg);color:#fca5a5;border:1px solid #7f1d1d}

/* OpenAI Floating Pill Composer */
.composer{
  position:absolute;
  left:12px;
  right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom));
  background:#212121;
  border:1px solid rgba(255,255,255,0.14);
  border-radius:28px;
  padding:8px 10px 8px 14px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
  z-index:30;
  display:flex;
  flex-direction:column;
  gap:6px;
  transition:border-color .15s,box-shadow .15s;
}
.composer:focus-within{
  border-color:rgba(255,255,255,0.3);
  box-shadow:0 14px 48px rgba(0,0,0,0.75);
}
.composer.drag{
  border-color:var(--openai-teal);
  box-shadow:0 0 0 3px rgba(16,163,127,0.25),0 12px 40px rgba(0,0,0,0.6);
}
.attachments{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 6px;
  scrollbar-width:none;
}
.attachments::-webkit-scrollbar{display:none}
.att{
  height:32px;
  max-width:160px;
  border-radius:var(--radius-pill);
  background:#2f2f2f;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 8px 0 10px;
  font-size:12.5px;
  flex-shrink:0;
}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{width:18px;height:18px;border-radius:50%;background:#444;color:#fff;font-size:11px;display:grid;place-items:center}
textarea{
  width:100%;
  min-height:38px;
  max-height:140px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  padding:6px 0;
  font-size:16px;
  line-height:1.4;
  color:var(--text);
}
textarea::placeholder{color:var(--text-muted)}
.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
}
.round{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#2f2f2f;
  display:grid;
  place-items:center;
  flex-shrink:0;
  color:#d4d4d4;
  transition:all .15s;
}
.round:active{transform:scale(0.92)}
.round svg{width:18px;height:18px}
.round.send{
  margin-left:auto;
  background:#ffffff;
  color:#000000;
}
.round.send:disabled{
  opacity:0.25;
  background:#2f2f2f;
  color:#8e8e8e;
}
.round.primary{
  background:#ffffff;
  color:#000000;
}
.model-chip{
  flex:1 1 120px;
  min-width:0;
  height:34px;
  border-radius:var(--radius-pill);
  background:#2a2a2a;
  border:1px solid var(--border);
  padding:0 10px;
  font-size:13px;
  font-weight:600;
  color:var(--text);
  outline:0;
}

/* Pair Screen */
.pair{height:100%;display:grid;place-items:start center;overflow:auto;-webkit-overflow-scrolling:touch;padding:48px 24px 24px;background:var(--bg)}
.pair-card{
  width:min(380px,100%);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:26px 22px;
  box-shadow:0 24px 70px rgba(0,0,0,0.5);
  text-align:center;
}
.pair-logo{
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--panel);
  border:1px solid var(--border);
  display:grid;
  place-items:center;
  margin:0 auto 16px;
  color:#fff;
}
.pair-card h1{margin:0 0 6px;font-size:22px;font-weight:700}
.pair-card p{margin:0 0 18px;font-size:14px;color:var(--text-muted);line-height:1.45}
.scan-qr-btn{
  width:100%;
  height:48px;
  border-radius:var(--radius-md);
  background:#ffffff;
  color:#000000;
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .12s;
}
.scan-qr-btn:active{transform:scale(0.98)}
.pair-divider{
  display:flex;
  align-items:center;
  text-align:center;
  color:var(--text-soft);
  font-size:12px;
  margin:16px 0;
}
.pair-divider::before,.pair-divider::after{content:'';flex:1;border-bottom:1px solid var(--border)}
.pair-divider span{padding:0 10px}
.pair-card input{
  width:100%;
  height:48px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:#090909;
  padding:0 12px;
  outline:0;
  font-size:20px;
  letter-spacing:.12em;
  text-align:center;
  color:#fff;
}
.pair-card input:focus{border-color:var(--border-focus)}
.pair-card button.submit-btn{
  width:100%;
  height:46px;
  border-radius:var(--radius-md);
  background:#262626;
  color:#ffffff;
  font-weight:700;
  margin-top:12px;
}
.pair-card button.submit-btn:active{background:#333}
.pair-card button:disabled{opacity:0.5}
.pair-error{min-height:20px;color:#f87171;margin-top:8px;font-size:13px}

/* Settings & Bottom Sheet Modals */
.settings-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  z-index:99;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0;
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.settings-card{
  width:100%;
  max-width:540px;
  margin:0 auto;
  background:#171717;
  border-top:1px solid var(--border);
  border-radius:24px 24px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -16px 50px rgba(0,0,0,0.6);
  max-height:85vh;
  overflow-y:auto;
}
.settings-handle{
  width:36px;
  height:4px;
  border-radius:2px;
  background:#3a3a3a;
  margin:0 auto 16px;
}
.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.settings-head h2{margin:0;font-size:18px;font-weight:700}
.close-btn{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#262626;
  color:#fff;
  font-size:16px;
  display:grid;
  place-items:center;
}
.settings-group{margin-bottom:14px}
.settings-group label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.settings-select{
  width:100%;
  height:44px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:#0d0d0d;
  padding:0 12px;
  font-weight:600;
  font-size:14px;
}
.settings-val{
  font-size:13.5px;
  color:#e0e0e0;
  background:#0d0d0d;
  padding:10px 12px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
}
.settings-action-btn{
  width:100%;
  height:44px;
  border-radius:var(--radius-md);
  background:#262626;
  color:#fff;
  font-weight:600;
  font-size:14px;
  margin-top:10px;
}
.danger-action-btn{
  width:100%;
  height:44px;
  border-radius:var(--radius-md);
  background:var(--danger-bg);
  color:#fca5a5;
  border:1px solid #7f1d1d;
  font-weight:600;
  font-size:14px;
  margin-top:10px;
}
.diag-box{
  font:11.5px/1.45 var(--code);
  background:#090909;
  border:1px solid #262626;
  border-radius:var(--radius-md);
  padding:10px;
  margin-top:10px;
  max-height:160px;
  overflow:auto;
  color:#a3a3a3;
}

@media(min-width:768px){
  .app{max-width:540px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .composer{left:calc(50% - 258px);right:calc(50% - 258px)}
}
</style>
</head>
<body>

<!-- Pairing Screen -->
<section id="pairScreen" class="pair hidden">
  <div class="pair-card">
    <div class="pair-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8.8 2h8.4l-4 7h5.7L8 22l2.7-8H5.1z"/></svg>
    </div>
    <h1 data-i18n="pair_title">LocalCode koppeln</h1>

document.documentElement.lang=lang;

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const MAX_FILES=20, MAX_FILE_BYTES=32*1024*1024, MAX_TOTAL_BYTES=96*1024*1024;
const state={token:localStorage.getItem('localcodeRemoteToken')||'',status:null,projects:[],projectsRoot:'',quarantine:[],threads:[],events:[],pending:null,currentThread:'',project:'',files:[],view:'tasks',es:null,sending:false,preferredEngine:localStorage.getItem('localcodeRemoteEngine')||'native',engineSynced:false};

const engineOptions=[['native','LocalCode Native'],['aider','Aider'],['opencode','OpenCode'],['claude','Claude Code'],['claw','Claw Code']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opts={}){const h={'Accept':'application/json',...(opts.headers||{})};if(state.token)h['X-LocalCode-Remote-Token']=state.token;if(opts.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(path,{...opts,headers:h});if(!r.ok)throw new Error((await r.text()).trim()||`HTTP ${r.status}`);return r.headers.get('content-type')?.includes('json')?r.json():r.text()}
function showPair(){$('#pairScreen').classList.remove('hidden');$('#app').classList.add('hidden');setTimeout(()=>$('#pairCode').focus(),30)}
function showApp(){$('#pairScreen').classList.add('hidden');$('#app').classList.remove('hidden')}
async function pair(ev){ev?.preventDefault();const btn=$('#pairBtn');try{btn.disabled=true;$('#pairError').textContent='';const r=await api('/remote/api/pair',{method:'POST',body:JSON.stringify({code:$('#pairCode').value.trim(),device_name:navigator.userAgent.slice(0,80)})});state.token=r.token;localStorage.setItem('localcodeRemoteToken',state.token);showApp();await refresh();connectEvents()}catch(e){$('#pairError').textContent=t('pair_failed')+' '+e.message}finally{btn.disabled=false}}
async function refresh(){try{state.status=await api('/remote/api/status');await ensurePreferredEngine();const p=await api('/remote/api/projects');state.projects=p.projects||[];state.projectsRoot=p.root||state.status.root_dir||'';const q=await api('/remote/api/project-quarantine');state.quarantine=q.quarantine||[];const th=await api('/remote/api/threads');state.threads=th.threads||[];state.currentThread=th.current||state.status.current_thread||'';const snap=await api('/remote/api/snapshot'+(state.currentThread?`?thread_id=${encodeURIComponent(state.currentThread)}`:''));state.events=snap.events||[];state.pending=snap.pending||null;state.project=snap.project||state.status.project||state.project||'';render();$('#dot').className='status-dot on'}catch(e){$('#dot').className='status-dot warn';if(String(e.message).includes('token')){state.token='';localStorage.removeItem('localcodeRemoteToken');showPair()}else console.warn(e)}}

async function ensurePreferredEngine(){if(state.engineSynced||!state.status||state.status.running||!state.preferredEngine||state.status.editing_engine===state.preferredEngine)return;state.engineSynced=true;try{const r=await api('/remote/api/editing-engine',{method:'POST',body:JSON.stringify({engine:state.preferredEngine})});state.status.editing_engine=r.engine}catch(e){state.engineSynced=false;console.warn(e)}}
async function selectEditingEngine(engine){if(state.status?.running)return;state.preferredEngine=engine;localStorage.setItem('localcodeRemoteEngine',engine);state.engineSynced=true;try{const r=await api('/remote/api/editing-engine',{method:'POST',body:JSON.stringify({engine})});if(state.status)state.status.editing_engine=r.engine;await refresh()}catch(e){renderEngineSelect();window.alert(e.message)}}
async function createProject(){if(state.status?.running)return;const name=window.prompt(t('project_name'),'');if(!name||!name.trim())return;try{const r=await api('/remote/api/project-action',{method:'POST',body:JSON.stringify({path:state.projectsRoot,action:'create_project',value:name.trim()})});state.project=r.project?.path||'';await refresh();showView('projects')}catch(e){window.alert(e.message)}}
async function createFolder(){if(state.status?.running)return;const name=window.prompt(t('folder_name'),'');if(!name||!name.trim())return;try{await api('/remote/api/project-action',{method:'POST',body:JSON.stringify({path:state.projectsRoot,action:'create_folder',value:name.trim()})});await refresh();showView('projects')}catch(e){window.alert(e.message)}}
async function deleteSelectedProject(){if(state.status?.running)return;const path=state.project||$('#projectSelect').value;if(!path){window.alert(t('nothing_selected'));return}try{const preview=await api('/remote/api/project-delete-preview?path='+encodeURIComponent(path));if(preview.empty){if(!window.confirm(t('delete_empty')))return;await api('/remote/api/project-action',{method:'POST',body:JSON.stringify({path,action:'delete_empty',value:''})})}else{const message=t('delete_full',{files:preview.files,dirs:preview.directories,bytes:preview.bytes})+' '+(preview.confirmation||'');const typed=window.prompt(message,'');if(typed===null)return;if(typed.trim()!==String(preview.confirmation)){window.alert(t('delete_mismatch'));return}await api('/remote/api/project-action',{method:'POST',body:JSON.stringify({path,action:'delete_recursive',value:typed.trim()})});window.alert(t('quarantine_done'))}state.project='';state.currentThread='';await refresh();showView('projects')}catch(e){window.alert(e.message)}}
function playStoreTask(){if(lang==='de')return `Erstelle für das ausgewählte Android-Projekt einen vollständigen lokalen Play-Store-Release-Build. Prüfe zuerst Projektstruktur, Gradle/SDK, applicationId/package, versionCode/versionName, Manifest, min/target SDK und die vorhandene Signing-Konfiguration. Verändere oder ersetze niemals Keystore, Upload-Key oder Zertifikat und gib niemals Passwörter, Tokens oder andere Secrets aus. Führe vorhandene Tests und Lint-Prüfungen aus. Erzeuge anschließend, sofern vom Projekt unterstützt, bundleRelease (.aab) und assembleRelease (.apk), verifiziere die Artefakte und nenne die exakten Pfade, Größen und SHA-256. Nutze vorhandene Gradle-Wrapper und keine globale Installation, wenn sie nicht ausdrücklich nötig und genehmigt ist. Wenn Signing, SDK, Gradle oder Store-Metadaten fehlen, behebe nur sichere lokale Konfiguration; geheime, destruktive, externe oder publizierende Schritte brauchen eine eigene Freigabe. Niemals automatisch zum Play Store hochladen, einen Release-Track verändern oder veröffentlichen.`;return `Create a complete local Play Store release build for the selected Android project. First inspect the project structure, Gradle/SDK, applicationId/package, versionCode/versionName, manifest, min/target SDK and existing signing configuration. Never create, replace or rotate a keystore, upload key or certificate, and never expose passwords, tokens or other secrets. Run existing tests and lint checks. Then, where supported, build bundleRelease (.aab) and assembleRelease (.apk), verify the artifacts and report exact paths, sizes and SHA-256 hashes. Use the project's Gradle wrapper and avoid global installs unless explicitly necessary and approved. If signing, SDK, Gradle or store metadata is missing, change only safe local configuration; secret, destructive, external or publishing steps require a separate approval. Never upload to Google Play, alter a release track or publish automatically.`}
async function playStoreBuild(){if(state.status?.running)return;const path=state.project||$('#projectSelect').value;if(!path){window.alert(t('nothing_selected'));return}if(!window.confirm(t('store_confirm')))return;try{const r=await api('/remote/api/new-chat',{method:'POST',body:JSON.stringify({project:path})});const thread=r.thread?.id||'';state.currentThread=thread;state.project=path;await api('/remote/api/chat',{method:'POST',body:JSON.stringify({message:playStoreTask(),project:path,thread_id:thread,model:state.status?.model||'',attachments:[]})});await refresh();showView('review')}catch(e){window.alert(e.message)}}
function renderTrash(){const host=$('#trashView');if(!state.quarantine.length){host.innerHTML=`<div class="empty"><div class="empty-logo">♲</div><h1>${t('trash')}</h1><p>${t('trash_empty')}</p></div>`;return}host.innerHTML=`<div class="section-title">${t('trash')}</div>`+state.quarantine.map(entry=>`<div class="trash-card"><div class="row-title">${esc(entry.name)}</div><div class="row-sub">${esc(t('trash_meta',{files:entry.files,dirs:entry.directories,bytes:entry.bytes}))}</div><div class="trash-actions"><button data-restore="${esc(entry.id)}">${t('restore')}</button><button class="purge" data-purge="${esc(entry.id)}" data-name="${esc(entry.name)}">${t('purge')}</button></div></div>`).join('');host.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreTrashProject(b.dataset.restore));host.querySelectorAll('[data-purge]').forEach(b=>b.onclick=()=>purgeTrashProject(b.dataset.purge,b.dataset.name))}
async function restoreTrashProject(id){if(state.status?.running)return;try{await api('/remote/api/project-quarantine-action',{method:'POST',body:JSON.stringify({action:'restore',id})});await refresh();window.alert(t('restore_done'));showView('trash')}catch(e){window.alert(e.message)}}
async function purgeTrashProject(id,name){if(state.status?.running)return;const expected='PURGE '+name;const typed=window.prompt(t('purge_prompt',{project:name})+' '+expected,'');if(typed===null)return;if(typed!==expected){window.alert(t('delete_mismatch'));return}try{await api('/remote/api/project-quarantine-action',{method:'POST',body:JSON.stringify({action:'purge',id,confirmation:typed})});await refresh();window.alert(t('purge_done'));showView('trash')}catch(e){window.alert(e.message)}}
function renderEvents(){const host=$('#reviewView');if(!state.events.length){host.innerHTML=`<div class="empty"><div class="empty-logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.8 2h8.4l-4 7h5.7L8 22l2.7-8H5.1z"/></svg></div><h1>LocalCode</h1><p>${t('no_events')}</p></div>`;return}const visible=state.events.filter(ev=>!(ev.type==='status'&&(ev.message==='Bereit'||ev.message==='Ready')));host.innerHTML=visible.map(eventHTML).join('');host.scrollTop=host.scrollHeight}
function eventHTML(ev){const user=ev.type==='user',isFinal=ev.type==='final',isErr=ev.type==='error'||ev.type==='tool_error',isWarn=ev.type==='warning',isTool=['tool_result','action_done','action_running','agent_step','progress'].includes(ev.type);let detail=ev.detail?`<div class="code"><div class="code-header"><span>Output</span><button class="copy-code-btn" type="button" onclick="navigator.clipboard.writeText(this.closest('.code').innerText)">Kopieren</button></div>${esc(ev.detail)}</div>`:'';if(ev.preview)detail+=`<div class="code"><div class="code-header"><span>Preview</span><button class="copy-code-btn" type="button" onclick="navigator.clipboard.writeText(this.closest('.code').innerText)">Kopieren</button></div>${esc(ev.preview)}</div>`;const meta=[ev.action,ev.path,ev.command].filter(Boolean).map(x=>`<span class="event-chip">${esc(x)}</span>`).join('');if(isTool){return`<details class="bubble-row agent tool-step"><summary class="event-summary"><span class="tool-chevron">›</span> <b>${esc(ev.action||ev.type||'Aktion')}</b>: ${esc(ev.message||'')}</summary>${detail}${meta?`<div class="event-meta">${meta}</div>`:''}</details>`}return`<div class="bubble-row ${user?'user':'agent'}${isFinal?' final-result':''}${isErr?' error':''}${isWarn?' warning':''}"><div class="bubble"><div>${esc(ev.message||ev.type||'')}</div>${detail}${meta?`<div class="event-meta">${meta}</div>`:''}</div></div>`}
function renderApproval(){const host=$('#approveView'),p=state.pending;if(!p){host.innerHTML=`<div class="empty"><div class="empty-logo">✓</div><h1>${t('approve')}</h1><p>${t('pending_none')}</p></div>`;return}host.innerHTML=`<div class="approval-card"><h2>${esc(p.message||p.action||t('approve'))}</h2><div class="row-sub">${esc([p.action,p.path,p.command].filter(Boolean).join(' · '))}</div>${p.preview?`<div class="code">${esc(p.preview)}</div>`:''}<div class="approval-actions"><button class="approve" data-decision="once">${t('approve_once')}</button><button class="always" data-decision="project">${t('approve_project')}</button><button class="reject" data-decision="reject">${t('reject')}</button></div></div>`;host.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>approve(b.dataset.decision))}
function renderNew(){$('#newView').innerHTML=`<div class="empty"><div class="empty-logo">＋</div><h1>LocalCode</h1><p>${t('new_chat')}</p></div>`}
function renderFiles(){const box=$('#attachments');box.classList.toggle('hidden',!state.files.length);box.innerHTML=state.files.map((f,i)=>`<div class="att"><span>${esc(f.name)}</span><button type="button" data-remove="${i}">×</button></div>`).join('');box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.files.splice(Number(b.dataset.remove),1);renderFiles()});updateSendState()}
async function approve(decision){if(!state.pending)return;await api('/remote/api/approve',{method:'POST',body:JSON.stringify({id:state.pending.id,decision,approve:decision!=='reject'})});state.pending=null;await refresh()}
function readFile(file){return new Promise((res,rej)=>{if(file.size>MAX_FILE_BYTES)return rej(new Error(t('file_too_large',{name:file.name})));const fr=new FileReader();fr.onerror=()=>rej(fr.error);fr.onload=()=>{const v=String(fr.result||''),i=v.indexOf(',');res({name:file.name,mime:file.type||'application/octet-stream',size:file.size,data:i>=0?v.slice(i+1):v})};fr.readAsDataURL(file)})}
async function addFiles(files){const list=[...files].filter(Boolean);if(!list.length)return;let total=state.files.reduce((n,f)=>n+f.size,0),room=MAX_FILES-state.files.length;if(room<=0)return window.alert(t('max_files',{count:MAX_FILES}));try{for(const f of list.slice(0,room)){if(total+f.size>MAX_TOTAL_BYTES)throw new Error(t('total_too_large'));const item=await readFile(f);state.files.push(item);total+=item.size}renderFiles();$('#prompt').focus()}catch(e){window.alert(e.message)}}
function appendPromptText(text){text=String(text||'').trim();if(!text)return;const prompt=$('#prompt'),prefix=prompt.value.trim()?' ':'';prompt.value+=prefix+text;prompt.focus();updateSendState()}
window.localCodeVoiceResult=text=>appendPromptText(text);
function startVoiceInput(){if(window.LocalCodeAndroid?.startVoiceInput){window.LocalCodeAndroid.startVoiceInput();return}const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)return window.alert(t('voice_unavailable'));try{const rec=new Speech();rec.lang=navigator.language||lang;rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>appendPromptText(e.results?.[0]?.[0]?.transcript||'');rec.onerror=e=>window.alert(t('voice_failed')+' '+(e.error||''));rec.start()}catch(e){window.alert(t('voice_failed')+' '+e.message)}}
function triggerQrScan(){if(window.LocalCodeAndroid?.startQrScan){window.LocalCodeAndroid.startQrScan();return}window.alert(t('pair_help'))}
async function send(ev){ev?.preventDefault();if(state.sending)return;const msg=$('#prompt').value.trim();if(!msg&&!state.files.length)return;const project=$('#projectSelect').value||state.project;const attachments=state.files.map(({name,mime,size,data})=>({name,mime,size,data}));try{state.sending=true;updateSendState();await api('/remote/api/chat',{method:'POST',body:JSON.stringify({message:msg,project,thread_id:state.currentThread,model:state.status?.model||'',attachments})});$('#prompt').value='';state.files=[];renderFiles();await refresh();showView('review')}catch(e){window.alert(e.message)}finally{state.sending=false;updateSendState()}}
function showView(name){state.view=name;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));for(const v of viewOrder)$('#'+v+'View').classList.toggle('hidden',v!==name);render()}
function swipeView(step){const i=viewOrder.indexOf(state.view),next=viewOrder[Math.max(0,Math.min(viewOrder.length-1,i+step))];if(next&&next!==state.view)showView(next)}
function bindSwipe(){const area=$('.main');let sx=0,sy=0,active=false;area.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const tag=(e.target?.tagName||'').toUpperCase();if(['BUTTON','INPUT','TEXTAREA','SELECT','OPTION'].includes(tag))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;active=true},{passive:true});area.addEventListener('touchend',e=>{if(!active||!e.changedTouches.length)return;active=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.25)return;swipeView(dx<0?1:-1)},{passive:true});area.addEventListener('touchcancel',()=>{active=false},{passive:true})}
async function connectEvents(){if(state.es)state.es.close();if(!state.token)return;try{const stream=await api('/remote/api/event-ticket',{method:'POST'});const es=new EventSource('/remote/api/events?ticket='+encodeURIComponent(stream.ticket));state.es=es;es.onmessage=e=>{const ev=JSON.parse(e.data);if(ev.thread_id&&state.currentThread&&ev.thread_id!==state.currentThread)return;state.events.push(ev);if(ev.type==='approval_required'){state.pending=ev;showView('approve')}if(ev.type==='approval')state.pending=null;if(ev.type==='status')refresh();render()};es.onerror=()=>{es.close();if(state.es===es)setTimeout(connectEvents,1800)}}catch(e){console.warn(e);setTimeout(connectEvents,1800)}}

// Drawer Management
function openDrawer(){$('#drawer').classList.add('open');$('#drawerBackdrop').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawerBackdrop').classList.remove('open')}
$('#drawerToggleBtn').onclick=openDrawer;
$('#closeDrawerBtn').onclick=closeDrawer;
$('#drawerBackdrop').onclick=closeDrawer;
$('#newChatTopBtn').onclick=()=>{showView('new');$('#prompt').focus()};
$('#newChatDrawerBtn').onclick=()=>{closeDrawer();showView('new');$('#prompt').focus()};
$('#drawerApproveBtn').onclick=()=>{closeDrawer();showView('approve')};
$('#drawerTrashBtn').onclick=()=>{closeDrawer();showView('trash')};
$('#drawerSettingsBtn').onclick=()=>{closeDrawer();updateSettingsView();$('#settingsModal').classList.remove('hidden')};
$('#modelProjectPill').onclick=()=>{updateSettingsView();$('#settingsModal').classList.remove('hidden')};

// Event Handlers
$('#scanQrBtn').onclick=triggerQrScan;
$('#pairForm').onsubmit=pair;
$$('.tab').forEach(b=>b.onclick=()=>showView(b.dataset.view));
bindSwipe();
$('#attachBtn').onclick=()=>$('#fileInput').click();
$('#voiceBtn').onclick=startVoiceInput;
$('#fileInput').onchange=async e=>{await addFiles(e.target.files||[]);e.target.value=''};
const composer=$('#composer');composer.onsubmit=send;
composer.ondragover=e=>{if(e.dataTransfer?.files?.length){e.preventDefault();composer.classList.add('drag')}};
composer.ondragleave=()=>composer.classList.remove('drag');
composer.ondrop=e=>{composer.classList.remove('drag');if(e.dataTransfer?.files?.length){e.preventDefault();addFiles(e.dataTransfer.files)}};
$('#stopBtn').onclick=async()=>{await api('/remote/api/stop',{method:'POST'});await refresh()};
$('#sendBtn').onclick=send;
$('#prompt').oninput=()=>{
  const p=$('#prompt');
  p.style.height='auto';
  p.style.height=Math.min(140,Math.max(38,p.scrollHeight))+'px';
  updateSendState();
};
$('#projectSelect').onchange=e=>{
  const newProj=e.target.value;
  if(!newProj||newProj===state.project)return;
  const name=projectName(newProj);
  if(!window.confirm(t('switch_project_confirm',{project:name}))){
    renderProjectSelect();
    return;
  }
  state.project=newProj;
  render();
};

// Settings Modal Handlers
$('#settingsBtn').onclick=()=>{updateSettingsView();$('#settingsModal').classList.remove('hidden')};
$('#closeSettingsBtn').onclick=()=>$('#settingsModal').classList.add('hidden');
$('#settingsModal').onclick=e=>{if(e.target===$('#settingsModal'))$('#settingsModal').classList.add('hidden')};
$('#engineSelect').onchange=e=>selectEditingEngine(e.target.value);
$('#disconnectBtn').onclick=()=>{
  if(!window.confirm(t('disconnect_confirm')))return;
  state.token='';
  localStorage.removeItem('localcodeRemoteToken');
  $('#settingsModal').classList.add('hidden');
  showPair();
};
$('#diagBtn').onclick=async()=>{
  const box=$('#diagResult');box.classList.remove('hidden');box.textContent='Prüfe Systemdiagnose...';
  try{
    const d=window.LocalCodeAndroid?.runDiagnostics?JSON.parse(window.LocalCodeAndroid.runDiagnostics()):{};
    const st=await api('/remote/api/status');
    box.textContent=JSON.stringify({remote_status:st,android_diagnostics:d},null,2);
  }catch(e){box.textContent='Fehler: '+e.message}
};

window.LocalCodeRemoteControl={
  showView:v=>{showView(v);return true},
  selectProject:p=>{state.project=p;render();return true},
  selectThread:async id=>{await selectThread(id);return true},
  createProject:async name=>{if(state.status?.running)return null;const r=await api('/remote/api/project-action',{method:'POST',body:JSON.stringify({path:state.projectsRoot,action:'create_project',value:name})});state.project=r.project?.path||'';await refresh();return r},
  startTask:async(project,message,engine)=>{const r=await api('/remote/api/new-chat',{method:'POST',body:JSON.stringify({project})});const th=r.thread?.id||'';state.currentThread=th;state.project=project;if(engine)await selectEditingEngine(engine);await api('/remote/api/chat',{method:'POST',body:JSON.stringify({message,project,thread_id:th,model:state.status?.model||'',attachments:[]})});await refresh();showView('review');return{ok:true,thread:th}},
  sendPrompt:async text=>{$('#prompt').value=text;await send();return true},
  stopTask:async()=>{await api('/remote/api/stop',{method:'POST'});await refresh();return true},
  approve:async d=>{if(state.pending){await approve(d||'once');return true}return false},
  selectEngine:async e=>{await selectEditingEngine(e);return state.status?.editing_engine},
  openSettings:()=>{updateSettingsView();$('#settingsModal').classList.remove('hidden');return true},
  closeSettings:()=>{$('#settingsModal').classList.add('hidden');return true},
  injectVoice:text=>{appendPromptText(text);return true},
  triggerQrScan:()=>{triggerQrScan();return true},
  getState:()=>({token:!!state.token,view:state.view,status:state.status,projects:state.projects.length,threads:state.threads.length,currentThread:state.currentThread,currentProject:state.project,events:state.events.length,pending:!!state.pending}),
  runSelfTest:async()=>{const res=[];try{const st=await api('/remote/api/status');res.push({check:'status',ok:!!st.version});const pr=await api('/remote/api/projects');res.push({check:'projects',ok:Array.isArray(pr.projects)});const th=await api('/remote/api/threads');res.push({check:'threads',ok:Array.isArray(th.threads)});const sn=await api('/remote/api/snapshot');res.push({check:'snapshot',ok:Array.isArray(sn.events)});const tk=await api('/remote/api/event-ticket',{method:'POST'});res.push({check:'event_ticket',ok:!!tk.ticket});return{ok:res.every(r=>r.ok),results:res}}catch(e){return{ok:false,error:e.message,results:res}}}
};

const urlParams=new URLSearchParams(window.location.search);
const hashParams=new URLSearchParams(window.location.hash.replace(/^#/,''));
const qrCode=(urlParams.get('code')||hashParams.get('code')||'').trim();
if(qrCode){
  $('#pairCode').value=qrCode;
  showPair();
  pair();
}else if(state.token){
  showApp();
  refresh().then(connectEvents);
}else{
  showPair();
}
setInterval(refresh,5000);
})();
</script>
</body>
</html>
